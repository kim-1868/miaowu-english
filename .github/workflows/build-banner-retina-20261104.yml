# Single-use asset processing; no Cloudflare or D1 access.
name: Generate tablet retina banner assets (one-time)
on:
  push:
    branches: [fix/tablet-banner-retina-assets-20261104]
    paths: ['.github/workflows/build-banner-retina-20261104.yml']
permissions:
  contents: write
jobs:
  generate-approved-artwork-derivatives:
    if: ${{ github.repository == 'kim-1868/miaowu-english' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow and AVIF codec
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13" "pillow-avif-plugin>=1.5,<2"
      - name: Generate twice-resolution AVIF and WebP
        run: python scripts/build-retina-home-banner.py
      - name: Validate output file sizes
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s public/cat-reading-tablet-1x.webp)" -gt 20000
          test "$(stat -c%s public/cat-reading-tablet-2x.webp)" -gt 20000
          test "$(stat -c%s public/cat-reading-tablet-2x.avif)" -gt 20000
          test "$(stat -c%s public/cat-reading-tablet-2x.webp)" -lt 950000
          test "$(stat -c%s public/cat-reading-tablet-2x.avif)" -lt 950000
      - name: Commit ONLY generated image assets to approved feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/cat-reading-tablet-1x.webp public/cat-reading-tablet-2x.webp public/cat-reading-tablet-2x.avif
          git diff --cached --name-only | grep -Fxq 'public/cat-reading-tablet-1x.webp'
          ! git diff --cached --name-only | grep -vEx 'public/cat-reading-tablet-(1x.webp|2x.webp|2x.avif)'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets: add 1400px fallback and 2800px retina cat reading artwork"
          git push origin HEAD:refs/heads/fix/tablet-banner-retina-assets-20261104
