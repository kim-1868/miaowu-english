name: V1.2 published context gloss isolated aggregate synthetic QA
on:
  pull_request:
    paths:
      - sql/published_32_context_gloss_aggregate_readonly.sql
      - scripts/verify-published-context-gloss-aggregate.mjs
      - tests/v12-published-context-gloss-readonly.test.mjs
      - .github/workflows/v12-production-published-context-gloss-readonly.yml
      - .github/workflows/v12-published-context-gloss-qa.yml
  push:
    branches: [feature/v11-smart-vocab-preflight-20261109]
    paths:
      - sql/published_32_context_gloss_aggregate_readonly.sql
      - scripts/verify-published-context-gloss-aggregate.mjs
      - tests/v12-published-context-gloss-readonly.test.mjs
permissions:
  contents: read
jobs:
  synthetic-no-real-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          node --check scripts/verify-published-context-gloss-aggregate.mjs
          node --experimental-sqlite --test tests/v12-published-context-gloss-readonly.test.mjs
      - run: echo 'SYNTHETIC_ONLY_NO_PROD_CONNECTION_NO_PRIVATE_CONTENT'
