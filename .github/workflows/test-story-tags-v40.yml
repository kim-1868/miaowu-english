name: Verify sustainable story tagging V40
on:
  push:
    branches: [feature/story-tags-sustainable-v40-20261106]
    paths: [.github/workflows/test-story-tags-v40.yml]
permissions:
  contents: read
jobs:
  test:
    if: ${{ github.repository == 'kim-1868/miaowu-english' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate reusable suggestions and publisher controls
        shell: bash
        run: |
          set -euo pipefail
          node --check public/ops-console.js
          node --check public/story-tag-suggester.js
          node --check src/ops-console.js
          node --test tests/s163-batch-story-tags-v38.test.mjs tests/s164-story-tag-suggestions-v40.test.mjs tests/s162-voucher-control.test.mjs tests/v35-cross-novel-one-card.test.mjs
          npm run check
          npm run assets:production:build
          grep -Fq 'export function suggestStoryTags' dist-production/public/novel-file-parser.js
          grep -Fq '为全部已上架小说补齐推荐标签' dist-production/public/ops.html
          grep -Fq 'id="uploadTagSuggestions"' dist-production/public/ops.html
          grep -Fq '已有自定义标签' dist-production/public/ops-console.js
      - name: Run complete regression suite
        run: npm test
