name: V1.1 create private staging QA login (never production)
on:
  push:
    branches: [feature/v11-phase1-mobile-and-install-guide-20261106]
    paths: [.github/workflows/v11-create-qa-reader-once.yml]
permissions:
  contents: read
concurrency:
  group: miaowu-v11-staging-preview
  cancel-in-progress: false
jobs:
  create-test-reader:
    if: ${{ github.repository == 'kim-1868/miaowu-english' && github.ref == 'refs/heads/feature/v11-phase1-mobile-and-install-guide-20261106' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm ONLY the staging Worker and test database
        run: |
          set -euo pipefail
          node scripts/check-v11-preview-config.mjs
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const cfg=JSON.parse(readFileSync('v11-staging-qa-bootstrap.wrangler.jsonc','utf8'));
          const real=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          if(cfg.name!=='miaowu-english-staging'||real.name!==cfg.name||
             cfg.main!=='scripts/v11-staging-qa-bootstrap.mjs'||
             cfg.vars?.APP_ENV!=='staging'||
             cfg.d1_databases?.length!==1||
             cfg.d1_databases[0].database_name!=='miaowu-english-test'||
             cfg.d1_databases[0].database_id!==real.d1_databases[0].database_id||
             cfg.assets?.run_worker_first!==true||cfg.assets?.binding!=='ASSETS')
            throw Error('PREVIEW_ONLY_QA_TARGET_MISMATCH');
          console.log('PASS: explicit preview Worker + test-only D1');
          NODE
      - name: Complete regression before any QA test account creation
        run: |
          npm run check
          npm test
      - name: Prepare Wrangler with no deploy hooks
        run: npm install --no-save --ignore-scripts wrangler@^4
      - name: Create encrypted ephemeral endpoint secret and random test login
        run: |
          node --input-type=module <<'NODE'
          import {randomBytes} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          const credentials={
            username:'v11review_'+randomBytes(4).toString('hex'),
            password:'WLqa!'+randomBytes(12).toString('base64url')
          };
          const key=randomBytes(48).toString('hex');
          const p='v11-staging-qa-bootstrap.wrangler.jsonc';
          const cfg=JSON.parse(readFileSync(p,'utf8'));
          cfg.vars.QA_EXPIRY=String(Date.now()+9*60*1000);
          writeFileSync(p,JSON.stringify(cfg));
          writeFileSync(process.env.RUNNER_TEMP+'/v11qa-secret.json',JSON.stringify({QA_BOOTSTRAP_SECRET:key}),{mode:0o600});
          writeFileSync(process.env.RUNNER_TEMP+'/v11qa-payload.json',JSON.stringify(credentials),{mode:0o600});
          writeFileSync(process.env.RUNNER_TEMP+'/v11qa-token',key,{mode:0o600});
          NODE
      - name: Temporarily deploy authenticated QA provisioning endpoint on staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config v11-staging-qa-bootstrap.wrangler.jsonc --secrets-file "$RUNNER_TEMP/v11qa-secret.json" --keep-vars > "$RUNNER_TEMP/qa-deploy.log" 2>&1 || {
            grep -E 'ERROR|Error|permission|Unauthorized|forbidden' "$RUNNER_TEMP/qa-deploy.log" | head -n 8 || true
            exit 1
          }
          touch "$RUNNER_TEMP/v11qa-deployed"
          echo "TEMP_QA_ENDPOINT_DEPLOYED_TO_STAGING"
      - name: Register and verify ONE disposable test reader
        run: |
          set -euo pipefail
          url="https://miaowu-english-staging.kim10086a.workers.dev"
          anonymous="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST "$url/__v11_one_time_qa_account")"
          test "$anonymous" = "403" || { echo "QA_ENDPOINT_NOT_PROTECTED_HTTP_$anonymous"; exit 1; }
          key="$(cat "$RUNNER_TEMP/v11qa-token")"
          status="$(curl -sS --max-time 40 -o "$RUNNER_TEMP/v11qa-result.json" -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" \
            -H "X-QA-Authorization: $key" \
            --data-binary "@$RUNNER_TEMP/v11qa-payload.json" \
            "$url/__v11_one_time_qa_account")"
          test "$status" = "200" || {
            echo "QA_TEST_ACCOUNT_NOT_CREATED_HTTP_$status"
            node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          try{const x=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/v11qa-result.json','utf8'));console.log('QA_ERROR_CODE',x.error||'unknown')}catch{console.log('QA_RESPONSE_NOT_JSON')}
          NODE
            exit 1
          }
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/v11qa-result.json','utf8'));
          const creds=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/v11qa-payload.json','utf8'));
          if(x.ok!==true||x.loginVerified!==true||x.username!==creds.username||
             !x.entitlements?.includes('cet4'))throw Error('QA_LOGIN_VERIFICATION_FAILED');
          console.log('QA_READER_LOGIN_VERIFIED_IN_STAGING');
          console.log('QA_TEST_CATEGORIES '+x.entitlements.join(','));
          NODE
          touch "$RUNNER_TEMP/v11qa-verified"
      - name: ALWAYS restore normal password-protected staging Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/v11qa-deployed" ]; then
            node scripts/check-v11-preview-config.mjs
            npx wrangler deploy --config wrangler.jsonc --keep-vars > "$RUNNER_TEMP/qa-restore.log" 2>&1 || {
              grep -E 'ERROR|Error|permission|Unauthorized|forbidden' "$RUNNER_TEMP/qa-restore.log" | head -n 8 || true
              exit 1
            }
            code="$(curl --silent --show-error --max-time 25 -o /dev/null -w '%{http_code}' 'https://miaowu-english-staging.kim10086a.workers.dev/')"
            test "$code" = "401" || { echo "STAGING_PREVIEW_GATE_NOT_RESTORED_HTTP_$code"; exit 1; }
            echo "NORMAL_STAGING_PASSWORD_GATE_RESTORED"
          fi
          rm -f "$RUNNER_TEMP/v11qa-secret.json" "$RUNNER_TEMP/v11qa-token"
      - name: Display disposable TEST credentials in PRIVATE repository job log
        if: success()
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/v11qa-verified"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const user=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/v11qa-payload.json','utf8'));
          console.log('V11_PREVIEW_QA_USERNAME='+user.username);
          console.log('V11_PREVIEW_QA_PASSWORD='+user.password);
          console.log('STAGING_REVIEWER_GATE_PASSWORD_IS_UNCHANGED');
          NODE
          rm -f "$RUNNER_TEMP/v11qa-payload.json"
