name: Global dictionary STAGING D1 read-only readiness
on:
  push:
    branches: [feature/v11-smart-vocab-preflight-20261109]
    paths:
      - .github/workflows/global-dictionary-staging-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: global-dictionary-readonly-staging-probe
  cancel-in-progress: false
jobs:
  probe-staging-only:
    if: github.repository == 'kim-1868/miaowu-english'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify environment is isolated STAGING, no production URL
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          assert.equal(cfg.name,'miaowu-english-staging');
          assert.equal(cfg.vars.APP_ENV,'staging');
          assert.equal(cfg.d1_databases[0].database_name,'miaowu-english-test');
          assert.equal(cfg.d1_databases[0].database_id,'88a817cb-23bb-4ae4-bcb8-92286c4165d4');
          assert.notEqual(cfg.d1_databases[0].database_name,'miaowu-english-prod');
          for(let i=13;i<=18;i++){
           const name=fs.readdirSync('db').find(p=>p.startsWith(String(i).padStart(3,'0')+'_global_dictionary')&&p.endsWith('.sql'));
           assert.ok(name,'required additive staging migration file '+i+' missing');
          }
          console.log('STAGING_CONFIG_AND_013_TO_018_SQL_FILES_SAFE__NO_DATABASE_MUTATION');
          NODE
      - name: Install Wrangler for metadata-only D1 SELECT
        shell: bash
        run: npm install --no-save --ignore-scripts wrangler@^4
      - name: Query isolated staging D1 schema only, redact raw output
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'STAGING_D1_READONLY_BLOCKED_NO_CONFIGURED_CLOUDFLARE_SECRET'
            exit 1
          fi
          SQL="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('books','words','user_words','chapter_words','global_dictionary_sources','global_dictionary_entries','global_dictionary_forms','global_dictionary_lessons','global_dictionary_senses','global_dictionary_legacy_sense_links','global_dictionary_book_sense_bindings') ORDER BY name;"
          if ! npx wrangler d1 execute miaowu-english-test --remote --config wrangler.jsonc --command "$SQL" >/tmp/global-dictionary-staging-tables 2>&1; then
            echo 'STAGING_D1_READONLY_QUERY_FAILED_NO_SCHEMA_ASSERTION'
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const text=fs.readFileSync('/tmp/global-dictionary-staging-tables','utf8');
          for(const table of ['books','words','user_words','chapter_words'])
            assert.match(text,new RegExp('\\b'+table+'\\b'),
              'pre-existing staging table absent: '+table);
          const optional=['global_dictionary_sources','global_dictionary_entries',
           'global_dictionary_forms','global_dictionary_lessons',
           'global_dictionary_senses','global_dictionary_legacy_sense_links',
           'global_dictionary_book_sense_bindings'];
          const ready=optional.filter(x=>text.includes(x));
          console.log('STAGING_D1_BASELINE_TABLES_PRESENT');
          console.log('STAGING_GLOBAL_DICTIONARY_TABLES_PRESENT_COUNT_'+ready.length+'_OF_'+optional.length);
          console.log('STAGING_HAS_SENSE_TABLE_'+ready.includes('global_dictionary_senses'));
          console.log('NO_STORY_NO_ACCOUNT_NO_SECRET_DATA_EXPORTED');
          console.log('NO_CLOUDFLARE_DATABASE_WRITE_OR_DEPLOYMENT_EXECUTED');
          NODE
