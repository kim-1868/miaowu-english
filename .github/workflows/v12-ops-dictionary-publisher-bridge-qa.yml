name: V1.2 P0A real OPS Publisher trust receipt bridge QA
on:
  pull_request:
    paths:
      - src/ops-dictionary-publisher-bridge.js
      - src/worker.js
      - db/021_ops_dictionary_publisher_receipt_bridge.sql
      - tests/v12-ops-dictionary-publisher-bridge.test.mjs
      - .github/workflows/v12-ops-dictionary-publisher-bridge-qa.yml
  push:
    branches: [feature/v11-smart-vocab-preflight-20261109]
    paths:
      - src/ops-dictionary-publisher-bridge.js
      - src/worker.js
      - db/021_ops_dictionary_publisher_receipt_bridge.sql
      - tests/v12-ops-dictionary-publisher-bridge.test.mjs
      - .github/workflows/v12-ops-dictionary-publisher-bridge-qa.yml
permissions:
  contents: read
jobs:
  authenticated-publisher-signed-receipt-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax checks and TEST-only real OPS SQLite signoff chain
        run: |
          set -euo pipefail
          node --check src/ops-dictionary-publisher-bridge.js
          node --check src/worker.js
          node --experimental-sqlite --test tests/v12-ops-dictionary-publisher-bridge.test.mjs
          echo 'P0A_OPS_PUBLISHER_BRIDGE_CODE_VALIDATED_TEST_ONLY_NO_REMOTE_DB'
