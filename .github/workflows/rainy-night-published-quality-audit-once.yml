# One-off read-only production acceptance. No publishing or D1 writes.
name: Rainy Night published learning experience audit (read-only once)
on:
  push:
    branches: [main]
    paths: [.github/workflows/rainy-night-published-quality-audit-once.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a49a3795c43bf20001ed947810dc8d9dea34bfc
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts wrangler@^4 >/dev/null
      - name: Read actual published novel, phonetics and paid-only chapters
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          QUERY="SELECT (SELECT COUNT(*) FROM books WHERE id='rainy-night-archives-cet4-v1' AND status='published') published_books, (SELECT COUNT(*) FROM chapters WHERE book_id='rainy-night-archives-cet4-v1') total_chapters, (SELECT COUNT(*) FROM chapters WHERE book_id='rainy-night-archives-cet4-v1' AND published_at IS NOT NULL) live_chapters, (SELECT COUNT(*) FROM chapters WHERE book_id='rainy-night-archives-cet4-v1' AND is_preview=1) free_chapters, (SELECT COUNT(*) FROM chapter_words cw JOIN chapters c ON c.id=cw.chapter_id WHERE c.book_id='rainy-night-archives-cet4-v1') anchors, (SELECT COUNT(DISTINCT cw.word_id) FROM chapter_words cw JOIN chapters c ON c.id=cw.chapter_id WHERE c.book_id='rainy-night-archives-cet4-v1') target_words, (SELECT COUNT(DISTINCT w.id) FROM words w JOIN chapter_words cw ON cw.word_id=w.id JOIN chapters c ON c.id=cw.chapter_id WHERE c.book_id='rainy-night-archives-cet4-v1' AND (COALESCE(TRIM(w.phonetic_uk),'')='' OR COALESCE(TRIM(w.phonetic_us),'')='')) missing_ipa, (SELECT COUNT(DISTINCT w.id) FROM words w JOIN chapter_words cw ON cw.word_id=w.id JOIN chapters c ON c.id=cw.chapter_id WHERE c.book_id='rainy-night-archives-cet4-v1' AND COALESCE(TRIM(w.part_of_speech),'')='') missing_pos, (SELECT COUNT(DISTINCT w.id) FROM words w JOIN chapter_words cw ON cw.word_id=w.id JOIN chapters c ON c.id=cw.chapter_id WHERE c.book_id='rainy-night-archives-cet4-v1' AND (COALESCE(TRIM(w.example_en),'')='' OR COALESCE(TRIM(w.example_zh),'')='')) missing_examples"
          npx wrangler d1 execute miaowu-english-prod --remote --json --config deploy/production.wrangler.jsonc --command "$QUERY" > /tmp/rainy-night-published-audit.json
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          import assert from "node:assert/strict";
          const data=JSON.parse(readFileSync("/tmp/rainy-night-published-audit.json","utf8"));
          const r=(Array.isArray(data)?data:[data]).flatMap(x=>x.results||[])[0];
          assert.ok(r,"No remote audit row");
          const keys=["published_books","total_chapters","live_chapters","free_chapters","anchors","target_words","missing_ipa","missing_pos","missing_examples"];
          const m=Object.fromEntries(keys.map(k=>[k,Number(r[k])]));
          console.log("RAINY_NIGHT_PUBLISHED_ACCEPTANCE "+JSON.stringify(m));
          assert.equal(m.published_books,1);
          assert.equal(m.total_chapters,12);
          assert.equal(m.live_chapters,12);
          assert.equal(m.free_chapters,0);
          assert.equal(m.anchors,1892);
          assert.equal(m.target_words,188);
          assert.equal(m.missing_ipa,0);
          assert.equal(m.missing_pos,0);
          assert.equal(m.missing_examples,0);
          JS
