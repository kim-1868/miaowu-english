name: Study P1 PROD current Worker source audit - READ ONLY
on:
  push:
    branches: [perf/study-interaction-20261117]
    paths: [.github/workflows/study-interaction-prod-worker-source-audit.yml]
permissions: {contents: read}
jobs:
  read-only:
    if: github.repository == 'kim-1868/miaowu-english'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Download current compiled production Worker for private local comparison only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          code=$(curl --silent --show-error -L --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -D /tmp/prod-worker-headers -o /tmp/prod-worker-response \
            -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/miaowu-english-production")
          echo "CLOUDFLARE_WORKER_CONTENT_GET_HTTP=$code"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          headers=Path('/tmp/prod-worker-headers').read_text(errors='replace')
          body=Path('/tmp/prod-worker-response').read_bytes()
          content_type=next((line.strip() for line in headers.splitlines() if line.lower().startswith('content-type:')),'(none)')
          print('WORKER_CONTENT_TYPE',content_type)
          print('WORKER_BODY_BYTES',len(body),'sha256',hashlib.sha256(body).hexdigest()[:20])
          if 'application/json' in content_type:
              import json
              j=json.loads(body)
              print('RESULT_JSON_SUCCESS',j.get('success'),'ERROR_CODES',[x.get('code') for x in j.get('errors',[])])
          else:
              text=body.decode(errors='replace')
              for mark in ['progressOutbox','sourceMappingURL','content-type: application/javascript','export default','handleEcho','review_events','ops_live_book_versions','wordbook','STAGING_PREVIEW_PASSWORD','coverage-410','import/coverage','senseReader','SENSE_BRIDGE']:
                  print('WORKER_MARKER',mark,mark in text)
              print('WORKER_BOUNDARY_MODULES',len(re.findall(r'content-disposition:',text,re.I)))
              print('WORKER_TOP_300',repr(text[:300]))
          PY
          test "$code" = 200
      - name: Compare local Worker generated sizes and relevant source markers, no writes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-production-assets.mjs --approved-announcements >/dev/null
          npm install --no-save --ignore-scripts 'wrangler@^4' >/dev/null
          npx wrangler deploy --dry-run --config deploy/production.wrangler.jsonc --outdir /tmp/p1-worker-audit >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          print('DRYRUN_MODULES',[(str(p.name),p.stat().st_size) for p in Path('/tmp/p1-worker-audit').iterdir()])
          PY
          echo READ_ONLY_NO_DEPLOY
