name: V1.1 P5 reviewed sense mapping schema — isolated SQLite only
on:
  push:
    branches: [feature/v11-p5-reviewed-sense-mapping-schema-20261107]
  pull_request:
    branches: [feature/v11-phase1-mobile-and-install-guide-20261106]
permissions:
  contents: read
jobs:
  approved-alias-schema:
    if: ${{ github.repository == 'kim-1868/miaowu-english' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22 SQLite
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify additive 014 mapping writes are atomic and legacy tables unchanged
        run: node --experimental-sqlite --test tests/v11-p5-reviewed-sense-mapping-schema.test.mjs
      - name: Full website regression and production asset dry build
        run: |
          npm run check
          npm test
      - name: No remote D1 migration or user data
        run: |
          echo "LOCAL_SQLITE_ONLY"
          echo "NO_CLOUDFLARE_KEYS"
          echo "NO_WORD_ID_OR_USER_WORDS_CHANGES"
          echo "NO_PRODUCTION_DEPLOYMENT"
