# Single-use owner-approved customer category pagination release.
# User profile / novel content / D1 schema are not modified.
name: Publish Miaowu customer bookshelf pagination (one-time)
run-name: Category bookshelf 9 per page · 625cb8336af1
on:
  push:
    branches: [release/one-shot-shelf-pagination-20261104]
    paths: ['.github/workflows/deploy-bookshelf-pagination-20261104.yml']
permissions:
  contents: read
concurrency:
  group: miaowu-production-worker-deploy
  cancel-in-progress: false
jobs:
  production-shelf-pages:
    if: ${{ github.repository == 'kim-1868/miaowu-english' && github.ref == 'refs/heads/release/one-shot-shelf-pagination-20261104' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed immutable commit
        uses: actions/checkout@v4
        with:
          ref: 625cb8336af1b5ebc9806dff2bd5cf3a2441b727
          fetch-depth: 0
          persist-credentials: false
      - name: Guard production target and exact approved UI/paging diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "625cb8336af1b5ebc9806dff2bd5cf3a2441b727"
          grep -Fq '"name": "miaowu-english-production"' deploy/production.wrangler.jsonc
          grep -Fq '"database_name": "miaowu-english-prod"' deploy/production.wrangler.jsonc
          test ! -e private-output
          test ! -e private-input
          git diff --name-only ae8b74b1b24a7c3cb3a2f33fe95b0e677296087d HEAD | sort > /tmp/actual-files
          printf '%s\n' 'public/app.js' 'public/index.html' 'public/styles.css' 'src/worker.js' 'tests/s124-v1-customer-experience.test.mjs' 'tests/s133-watercolor-reference-art.test.mjs' 'tests/s135-category-svg-alignment.test.mjs' 'tests/s137-home-paw-reminder-and-baseline.test.mjs' 'tests/s138-immersive-home-scene.test.mjs' 'tests/s149-cover-led-responsive-bookshelf.test.mjs' 'tests/s152-home-resume-last-read.test.mjs' 'tests/s153-retina-banner-tablet.test.mjs' 'tests/s154-public-shelf-pagination.test.mjs' | sort > /tmp/approved-files
          diff -u /tmp/approved-files /tmp/actual-files
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler without application install hooks
        run: npm install --no-save --ignore-scripts wrangler@^4
      - name: Full regression, safe production assets and Worker dry-run
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
          node scripts/check-production-config.mjs deploy/production.wrangler.jsonc
          npm run assets:production:build
          grep -Fq '20261104-v27-shelf-pages' dist-production/public/index.html
          grep -Fq 'function renderShelfPagination' dist-production/public/app.js
          grep -Fq 'SHELF_PAGE_SIZE=9' dist-production/public/app.js
          grep -Fq 'V27: user-facing paginated story shelf' dist-production/public/styles.css
          grep -Fq 'cat-reading-tablet-2x.avif' dist-production/public/index.html
          grep -Fq '20261104-v23-withdraw-ready' dist-production/public/ops.html
          npx wrangler deploy --dry-run --config deploy/production.wrangler.jsonc --outdir .wrangler/dryrun-production
      - name: Guard exact current live site and working backend before deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 https://miaowu-english-pages.pages.dev/ -o /tmp/live-before.html
          grep -Fq '20261104-v26-retina-banner' /tmp/live-before.html
          if grep -Fq '20261104-v27-shelf-pages' /tmp/live-before.html; then
            echo "Pagination already deployed, abort duplicate";exit 1
          fi
          curl -fsSL --retry 3 --max-time 30 https://miaowu-english-pages.pages.dev/ops.html -o /tmp/ops-before.html
          grep -Fq '20261104-v23-withdraw-ready' /tmp/ops-before.html
          curl -fsSL --retry 3 --max-time 30 https://miaowu-english-pages.pages.dev/__miaowu_prod_edge_probe -o /tmp/edge-before.json
          node --input-type=module -e 'import fs from "node:fs";const x=JSON.parse(fs.readFileSync("/tmp/edge-before.json","utf8"));if(!x.ok||!x.productionBindingPresent)process.exit(1)'
      - name: Check Cloudflare deployment credential and withdrawal configuration
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$HAS_TOKEN" = "true"
          test "$HAS_ACCOUNT" = "true"
          npx wrangler secret list --config deploy/production.wrangler.jsonc > /tmp/bindings-before.json
          grep -Fq '"OPS_WITHDRAWAL_ENABLED"' /tmp/bindings-before.json
      - name: Deploy approved front-end and paginated read-only public catalog endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars --config deploy/production.wrangler.jsonc
      - name: Verify pages, novel-page API, and unchanged operator and access boundaries
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for i in $(seq 1 25); do
            curl -fsSL --max-time 25 "https://miaowu-english-pages.pages.dev/?shelf-v27=$i" -o /tmp/live-home.html || true
            if grep -Fq '20261104-v27-shelf-pages' /tmp/live-home.html; then break; fi
            sleep 4
          done
          grep -Fq '20261104-v27-shelf-pages' /tmp/live-home.html
          curl -fsSL --retry 3 --max-time 30 https://miaowu-english-pages.pages.dev/app.js -o /tmp/new-app.js
          grep -Fq 'function renderShelfPagination' /tmp/new-app.js
          curl -fsSL --retry 3 --max-time 30 https://miaowu-english-pages.pages.dev/styles.css -o /tmp/new-style.css
          grep -Fq 'V27: user-facing paginated story shelf' /tmp/new-style.css
          curl -fsSL --retry 3 --max-time 30 'https://miaowu-english-pages.pages.dev/api/books?category=cet4&page=1' -o /tmp/public-page-1.json
          node --input-type=module -e 'import fs from "node:fs";const x=JSON.parse(fs.readFileSync("/tmp/public-page-1.json","utf8"));if(!Array.isArray(x.books)||x.books.length>9||x.pagination?.page!==1||x.pagination?.pageSize!==9||x.pagination?.total<x.books.length)process.exit(1)'
          curl -fsSL --retry 3 --max-time 30 'https://miaowu-english-pages.pages.dev/api/books?category=cet4&page=2' -o /tmp/public-page-2.json
          node --input-type=module -e 'import fs from "node:fs";const a=JSON.parse(fs.readFileSync("/tmp/public-page-1.json","utf8")),b=JSON.parse(fs.readFileSync("/tmp/public-page-2.json","utf8"));if(b.pagination?.page!==2||b.books.length>9||a.books.some(x=>b.books.some(y=>x.id===y.id)))process.exit(1)'
          curl -fsSL --retry 3 --max-time 30 https://miaowu-english-pages.pages.dev/ops.html -o /tmp/ops-after.html
          grep -Fq '20261104-v23-withdraw-ready' /tmp/ops-after.html
          curl -fsSL --retry 3 --max-time 30 https://miaowu-english-pages.pages.dev/__miaowu_prod_edge_probe -o /tmp/edge-after.json
          node --input-type=module -e 'import fs from "node:fs";const x=JSON.parse(fs.readFileSync("/tmp/edge-after.json","utf8"));if(!x.ok||!x.productionBindingPresent)process.exit(1)'
          npx wrangler secret list --config deploy/production.wrangler.jsonc > /tmp/bindings-after.json
          grep -Fq '"OPS_WITHDRAWAL_ENABLED"' /tmp/bindings-after.json
          http=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 https://miaowu-english-pages.pages.dev/api/me/progress)
          test "$http" = "401"
