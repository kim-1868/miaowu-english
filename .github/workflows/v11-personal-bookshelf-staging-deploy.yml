# Stage-only release after refreshing historical cache-bust assertions; never deploy production.
name: V1.1 Bookshelf compact grid + paging STAGING only
on:
  push:
    branches: [feature/v11-personal-bookshelf-grid-pagination-20261109]
    paths:
      - '.github/workflows/v11-personal-bookshelf-staging-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: miaowu-v11-wave2-staging
  cancel-in-progress: false
jobs:
  staging-only:
    if: github.repository == 'kim-1868/miaowu-english'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert isolated staging and unmodified production binding
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const stage=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          assert.equal(stage.name,'miaowu-english-staging');
          assert.equal(stage.vars.APP_ENV,'staging');
          assert.equal(stage.d1_databases[0].database_name,'miaowu-english-test');
          assert.equal(stage.d1_databases[0].database_id,'88a817cb-23bb-4ae4-bcb8-92286c4165d4');
          assert.deepEqual(stage.secrets.required,['STAGING_PREVIEW_PASSWORD','ACTIVATION_PEPPER']);
          const prod=JSON.parse(fs.readFileSync('deploy/production.wrangler.jsonc','utf8'));
          assert.equal(prod.d1_databases[0].database_name,'miaowu-english-prod');
          assert.equal(prod.d1_databases[0].database_id,'649c71b3-340c-49bf-b806-3d39256851d3');
          const html=fs.readFileSync('public/index.html','utf8');
          assert.match(html,/v11-bookshelf\.css\?v=20261108-wave2-grid-pagination-20261109/);
          assert.match(html,/app\.js\?v=20261108-wave2-bookshelf-grid-pagination-20261109/);
          console.log('STAGING_TEST_D1_ONLY_PRODUCTION_UNTOUCHED');
          NODE
      - name: Revalidate pagination, full regressions, approved bundle
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --test tests/v11-personal-bookshelf-responsive-pagination.test.mjs
          npm run check
          npm test
          node scripts/build-production-assets.mjs --approved-announcements
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {auditProductionAssets} from './scripts/build-production-assets.mjs';
          assert.equal(auditProductionAssets({withAnnouncements:true}).assets.length,50);
          console.log('WAVE2_50_ASSETS_ANNOUNCEMENT_ON');
          NODE
      - name: Deploy STAGING Worker with its existing secrets and D1 (no migrations)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --no-save --ignore-scripts 'wrangler@^4'
          npx wrangler deploy --keep-vars --config wrangler.jsonc
          echo "STAGING_WORKER_DEPLOYED_NO_PRODUCTION_D1_WRITES"
      - name: Validate staging is still password-protected
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://miaowu-english-staging.kim10086a.workers.dev/'
          for attempt in $(seq 1 8); do
            code="$(curl -sS --retry 1 --max-time 20 -o /tmp/mw-staging-guest -w '%{http_code}' "$ORIGIN" || true)"
            if [ "$code" = '401' ] && grep -Fq 'Staging preview: credentials required' /tmp/mw-staging-guest; then
              echo 'STAGING_BOOKSHELF_PAGINATION_DEPLOYED_AND_ANONYMOUS_ACCESS_PROTECTED'
              exit 0
            fi
            sleep 3
          done
          echo "STAGING_PROTECTION_CHECK_FAILED_HTTP_$code"
          exit 1
