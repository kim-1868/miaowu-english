# Stage private Rainy Night manuscript in production D1 only.
# Deliberately never mark book/chapters published or grant entitlements.
name: Stage Rainy Night (private D1 draft, not publication)
run-name: Rainy Night PRIVATE draft · reviewed release S88 · ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type STAGE_RAINY_NIGHT_DRAFT; this never publishes the book'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: miaowu-production-d1-private-editorial-import
  cancel-in-progress: false

jobs:
  stage-private-draft:
    if: inputs.confirmation == 'STAGE_RAINY_NIGHT_DRAFT'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout EXACT reviewed full-story release
        uses: actions/checkout@v4
        with:
          ref: fd7564384ade09cd820874277c159566ca4b9f70
          persist-credentials: false

      - name: Verify pinned source and Cloudflare D1 binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fd7564384ade09cd820874277c159566ca4b9f70"
          grep -Fq '"database_name": "miaowu-english-prod"' deploy/production.wrangler.jsonc
          grep -Fq '"database_id": "649c71b3-340c-49bf-b806-3d39256851d3"' deploy/production.wrangler.jsonc
          test ! -e private-output
          test ! -e private-input

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler without app install hooks
        run: npm install --no-save --ignore-scripts wrangler@^4

      - name: Run local integrity and private importer checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
          node scripts/build-rainy-night-member-draft-import.mjs --write-private
          test -s private-output/rainy-night-member/rainy-night-cet4-member-12chapters-DRAFT-UNREVIEWED.sql
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import assert from "node:assert/strict";
            const s=readFileSync("private-output/rainy-night-member/rainy-night-cet4-member-12chapters-DRAFT-UNREVIEWED.sql","utf8");
            assert.equal((s.match(/INSERT OR IGNORE INTO chapters\(/g)||[]).length,12);
            assert.equal((s.match(/INSERT OR IGNORE INTO chapter_words\(/g)||[]).length,733);
            assert.doesNotMatch(s,/UPDATE\s+books\s+SET/i);
            assert.doesNotMatch(s,/INSERT\s+(?:OR\s+\w+\s+)?INTO\s+entitlements/i);
            assert.doesNotMatch(s,/DROP\s+TABLE|DELETE\s+FROM|ALTER\s+TABLE/i);
          '

      - name: Confirm Cloudflare secrets are configured
        shell: bash
        env:
          TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_D1_API_TOKEN != '' }}
          ACCOUNT_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          test "$TOKEN_PRESENT" = "true"
          test "$ACCOUNT_PRESENT" = "true"

      - name: Preflight production D1 without reading any customer data
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx wrangler d1 execute miaowu-english-prod --config deploy/production.wrangler.jsonc --remote --json --command             "SELECT (SELECT COUNT(*) FROM categories WHERE id='cet4') AS category_count, (SELECT COUNT(*) FROM books WHERE id='rainy-night-archives-cet4-v1') AS book_count, (SELECT COALESCE(MAX(status),'') FROM books WHERE id='rainy-night-archives-cet4-v1') AS book_status, (SELECT COUNT(*) FROM chapters WHERE book_id='rainy-night-archives-cet4-v1') AS chapter_count" > /tmp/rainy-private-before.json 2>&1; then
            echo "Cloudflare D1 readonly preflight failed; sanitized diagnostic follows:"
            node --input-type=module -e '
              import {readFileSync} from "node:fs";
              const s=readFileSync("/tmp/rainy-private-before.json","utf8");
              console.log(s.replace(/Bearer\s+\S+/gi,"Bearer [redacted]")
                .replace(/[A-Za-z0-9_-]{32,}/g,"[token-redacted]").slice(-1200));
            '
            exit 1
          fi
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import assert from "node:assert/strict";
            const data=JSON.parse(readFileSync("/tmp/rainy-private-before.json","utf8"));
            const row=(Array.isArray(data)?data:[data]).flatMap(x=>x.results||[])[0];
            assert.ok(row,"Missing D1 preflight row");
            assert.equal(Number(row.category_count),1,"CET4 category missing");
            assert.ok(Number(row.book_count)===0||Number(row.book_count)===1,"Unexpected duplicate");
            if(Number(row.book_count)===1)assert.equal(row.book_status,"draft","Refuse to modify a published book");
            assert.ok([0,12].includes(Number(row.chapter_count)),"Refuse partial/conflicting chapter import");
            console.log("Private staging preflight passed. Existing chapters:",row.chapter_count);
          '

      - name: Import only hidden draft rows, never publish or grant access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute miaowu-english-prod --config deploy/production.wrangler.jsonc --remote --yes             --file=private-output/rainy-night-member/rainy-night-cet4-member-12chapters-DRAFT-UNREVIEWED.sql

      - name: Check post-import book remains hidden and content has 12 private chapters
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute miaowu-english-prod --config deploy/production.wrangler.jsonc --remote --json --command             "SELECT (SELECT COUNT(*) FROM books WHERE id='rainy-night-archives-cet4-v1' AND status='draft') AS draft_count, (SELECT COUNT(*) FROM chapters WHERE book_id='rainy-night-archives-cet4-v1') AS chapter_count, (SELECT COUNT(*) FROM chapters WHERE book_id='rainy-night-archives-cet4-v1' AND is_preview=1) AS preview_count, (SELECT COUNT(*) FROM chapters WHERE book_id='rainy-night-archives-cet4-v1' AND published_at IS NOT NULL) AS released_count, (SELECT COUNT(*) FROM chapter_words cw JOIN chapters ch ON ch.id=cw.chapter_id WHERE ch.book_id='rainy-night-archives-cet4-v1') AS word_occurrences" > /tmp/rainy-private-after.json
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import assert from "node:assert/strict";
            const data=JSON.parse(readFileSync("/tmp/rainy-private-after.json","utf8"));
            const row=(Array.isArray(data)?data:[data]).flatMap(x=>x.results||[])[0];
            assert.ok(row,"Missing D1 verification row");
            for(const [key,value] of Object.entries({draft_count:1,chapter_count:12,preview_count:0,released_count:0,word_occurrences:733}))
              assert.equal(Number(row[key]),value,"Unexpected private import status "+key);
            console.log("12 chapters safely staged as a PRIVATE DRAFT; 0 chapters published. Editorial signoff remains required.");
          '
