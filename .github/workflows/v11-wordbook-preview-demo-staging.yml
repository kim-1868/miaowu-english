# Final confirm full totals beyond 200 bookmarked words, then redeploy protected staging.
# Recheck after adapting legacy render harness to paginated server results.
name: V1.1 36-card wordbook pagination demo STAGING only
on:
  push:
    branches: [feature/v11-wordbook-preview-demo-20261109]
    paths:
      - .github/workflows/v11-wordbook-preview-demo-staging.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: miaowu-v11-wave2-staging
  cancel-in-progress: false
jobs:
  preview-only:
    if: github.repository == 'kim-1868/miaowu-english'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Gate staging D1 only and preserve registered accounts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          assert.equal(s.name,'miaowu-english-staging');
          assert.equal(s.vars.APP_ENV,'staging');
          assert.equal(s.d1_databases[0].database_name,'miaowu-english-test');
          assert.equal(s.d1_databases[0].database_id,'88a817cb-23bb-4ae4-bcb8-92286c4165d4');
          const p=JSON.parse(fs.readFileSync('deploy/production.wrangler.jsonc','utf8'));
          assert.equal(p.d1_databases[0].database_name,'miaowu-english-prod');
          assert.equal(p.d1_databases[0].database_id,'649c71b3-340c-49bf-b806-3d39256851d3');
          assert.match(fs.readFileSync('src/onboarding.js','utf8'),/eligible:!!entry/);
          console.log('SAFE_STAGING_ONLY_NO_PRODUCTION_D1_OR_ACCOUNT_MUTATION');
          NODE
      - name: Wordbook bookmark and first-use actual SQLite, whole-project regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check src/reading-library.js
          node --check src/my-bookshelf.js
          node --test tests/v11-wordbook-staging-preview-demo.test.mjs
          node --test tests/v11-favorites-wordbook-pages.test.mjs tests/v11-wave2-real-sqlite-integration.test.mjs
          npm run check
          npm test
      - name: Check announcements and 50 approved production assets, no release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-production-assets.mjs --approved-announcements
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import fs from 'node:fs';
          import {auditProductionAssets} from './scripts/build-production-assets.mjs';
          assert.equal(auditProductionAssets({withAnnouncements:true}).assets.length,50);
          const html=fs.readFileSync('dist-production/public/index.html','utf8');
          for(const fragment of ['siteUpdateBanner','myBookshelf','mwWelcomeDialog','wordbook12','favorites'])assert.ok(html.includes(fragment));
          assert.match(fs.readFileSync('dist-production/public/v11-wordbook.css','utf8'),/bookplate-pagination/);
          console.log('50_REVIEWED_ASSETS_AND_NEW_PAGES_PRESENT');
          NODE
      - name: Deploy protected preview Worker only, retain current secrets, no migrations
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --no-save --ignore-scripts 'wrangler@^4'
          npx wrangler deploy --keep-vars --config wrangler.jsonc
          echo 'STAGING_FAVORITES_AND_WORDBOOK_PAGINATION_DEPLOYED_NO_D1_MIGRATION'
      - name: Check protected staging still denies anonymous readers
        shell: bash
        run: |
          set -euo pipefail
          URL='https://miaowu-english-staging.kim10086a.workers.dev/'
          for i in $(seq 1 8); do
            code="$(curl -sS --max-time 20 -o /tmp/staging-gate-check -w '%{http_code}' "$URL" || true)"
            if [ "$code" = '401' ] && grep -Fq 'Staging preview: credentials required' /tmp/staging-gate-check;then
              echo 'PREVIEW_PASSWORD_PROTECTED__STAGING_DEPLOY_VERIFIED'
              exit 0
            fi
            sleep 3
          done
          echo "STAGING_PREVIEW_GATE_CHECK_FAILED_$code"
          exit 1
