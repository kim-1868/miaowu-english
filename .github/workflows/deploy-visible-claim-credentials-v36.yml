name: Publish Miaowu claim credential visibility V36
on:
  push:
    branches: [release/visible-claim-credentials-v36-20261105]
    paths: [.github/workflows/deploy-visible-claim-credentials-v36.yml]
permissions:
  contents: read
concurrency:
  group: miaowu-production-worker-deploy
  cancel-in-progress: false
jobs:
  secure-static-claim-fix:
    if: ${{ github.repository == 'kim-1868/miaowu-english' && github.ref == 'refs/heads/release/visible-claim-credentials-v36-20261105' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exactly tested V36, preserving V35 admin features
        uses: actions/checkout@v4
        with:
          ref: 6626b05ef34653a178a3ef61f202048817b7fce8
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm static-only diff, correct production binding and V35 functionality
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6626b05ef34653a178a3ef61f202048817b7fce8"
          grep -Fq '"name": "miaowu-english-production"' deploy/production.wrangler.jsonc
          grep -Fq '"database_name": "miaowu-english-prod"' deploy/production.wrangler.jsonc
          git diff --name-only 7eb36bdb353aa33600ae97fd38791435165e4ba4 HEAD | sort > /tmp/changed
          printf '%s\n' .github/workflows/test-visible-credentials-v36.yml             public/claim.css public/claim.html public/claim.js             tests/s160-claim-receipt-ux.test.mjs             tests/s161-claim-visible-runtime.test.mjs | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
          grep -Fq '已有自定义标签' public/ops-console.js
          test ! -e private-output
          test ! -e private-input
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-run runtime and full site regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --check public/claim.js
          node --test tests/s160-claim-receipt-ux.test.mjs tests/s161-claim-visible-runtime.test.mjs
          npm run check
          npm test
          node scripts/check-production-config.mjs deploy/production.wrangler.jsonc
          npm run assets:production:build
          grep -Fq '<section id="recoveryDetails"' dist-production/public/claim.html
          grep -Fq 'restoreReceipt()' dist-production/public/claim.js
          ! grep -Fq 'addEventListener("pagehide"' dist-production/public/claim.js
      - name: Install Wrangler, no package lifecycle hooks
        run: npm install --no-save --ignore-scripts wrangler@^4
      - name: Production Worker dry run
        run: npx wrangler deploy --dry-run --config deploy/production.wrangler.jsonc
      - name: Verify current live claim page, V35 operator presets and reader
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 25 https://miaowu-english-pages.pages.dev/claim -o /tmp/claim-before
          grep -Fq '小红书-订单编号' /tmp/claim-before
          curl -fsSL --retry 3 --max-time 25 https://miaowu-english-pages.pages.dev/ops-console.js -o /tmp/ops-before
          grep -Fq '已有自定义标签' /tmp/ops-before
          curl -fsSL --retry 3 --max-time 25 https://miaowu-english-pages.pages.dev/ -o /tmp/home-before
          grep -Fq 'v31-word-only' /tmp/home-before
      - name: Require production deployment permission
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          test "$HAS_TOKEN" = true
          test "$HAS_ACCOUNT" = true
      - name: Deploy same Worker backend with corrected buyer assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars --config deploy/production.wrangler.jsonc
      - name: Verify production code visibility, live presets, protected admin and reader
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            curl -fsSL --max-time 20 "https://miaowu-english-pages.pages.dev/claim?v36=$i" -o /tmp/claim-after || true
            if grep -Fq '<section id="recoveryDetails"' /tmp/claim-after; then break; fi
            sleep 3
          done
          grep -Fq '<section id="recoveryDetails"' /tmp/claim-after
          grep -Fq '账号找回备用凭证' /tmp/claim-after
          grep -Fq '小红书-订单编号' /tmp/claim-after
          curl -fsSL --retry 3 --max-time 25 https://miaowu-english-pages.pages.dev/claim.js -o /tmp/script-after
          grep -Fq 'restoreReceipt()' /tmp/script-after
          ! grep -Fq 'addEventListener("pagehide"' /tmp/script-after
          curl -fsSL --retry 3 --max-time 25 https://miaowu-english-pages.pages.dev/ops-console.js -o /tmp/ops-after
          grep -Fq '已有自定义标签' /tmp/ops-after
          curl -fsSL --retry 3 --max-time 25 https://miaowu-english-pages.pages.dev/api/claim/categories -o /tmp/catalog-after
          node --input-type=module -e 'import fs from "node:fs";const d=JSON.parse(fs.readFileSync("/tmp/catalog-after","utf8"));if(!d.enabled||!Array.isArray(d.categories))process.exit(1)'
          guest=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://miaowu-english-pages.pages.dev/api/ops/claims/query -H 'Origin: https://miaowu-english-pages.pages.dev' -H 'Content-Type: application/json' -d '{"page":1}')
          test "$guest" = "401"
          curl -fsSL --retry 3 --max-time 25 https://miaowu-english-pages.pages.dev/ -o /tmp/home-after
          grep -Fq 'v31-word-only' /tmp/home-after
