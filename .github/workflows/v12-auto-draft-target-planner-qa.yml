name: V1.2 auto-match new novel draft target suggestions QA
on:
  pull_request:
    paths:
      - src/global-dictionary-auto-draft-target-planner.js
      - tests/v12-auto-draft-target-planner.test.mjs
      - .github/workflows/v12-auto-draft-target-planner-qa.yml
  push:
    branches: [feature/v11-smart-vocab-preflight-20261109]
    paths:
      - src/global-dictionary-auto-draft-target-planner.js
      - tests/v12-auto-draft-target-planner.test.mjs
permissions:
  contents: read
jobs:
  synthetic-draft-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          node --check src/global-dictionary-auto-draft-target-planner.js
          node --test tests/v12-auto-draft-target-planner.test.mjs
      - run: echo 'AUTO_DISCOVERY_READONLY_NO_PUBLISHER_WRITE_NO_USER_STUDY_CHANGES'
