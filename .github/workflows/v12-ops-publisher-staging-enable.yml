name: P0 real OPS Publisher signing bridge STAGING enable (protected)
on:
  workflow_dispatch:
    inputs:
      public_key_fingerprint:
        type: string
        required: true
        description: Public SHA256 fingerprint from local Publisher key init; NEVER private key
      confirm_target:
        type: string
        required: true
        description: Enter miaowu-english-test
      confirmation:
        type: string
        required: true
        description: Enter ENABLE_TEST_ONLY_PUBLISHER_BRIDGE
permissions:
  contents: read
concurrency:
  group: p0-staging-deploy-ops-signing
  cancel-in-progress: false
jobs:
  staging-publisher-bridge-protected:
    if: >-
      github.repository == 'kim-1868/miaowu-english' &&
      github.actor == 'kim-1868' &&
      github.ref == 'refs/heads/feature/v11-smart-vocab-preflight-20261109' &&
      github.event_name == 'workflow_dispatch'
    environment:
      name: staging-d1-schema-approval
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restrict scope, reject malformed public fingerprint and production target
        shell: bash
        env:
          PIN: ${{ inputs.public_key_fingerprint }}
          TARGET: ${{ inputs.confirm_target }}
          CONFIRM: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$TARGET" = 'miaowu-english-test'
          test "$CONFIRM" = 'ENABLE_TEST_ONLY_PUBLISHER_BRIDGE'
          [[ "$PIN" =~ ^[a-f0-9]{64}$ ]]
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          assert.equal(c.name,'miaowu-english-staging');
          assert.equal(c.vars.APP_ENV,'staging');
          assert.equal(c.d1_databases.length,1);
          assert.equal(c.d1_databases[0].database_name,'miaowu-english-test');
          assert.equal(c.d1_databases[0].database_id,'88a817cb-23bb-4ae4-bcb8-92286c4165d4');
          for(const flag of ['OPS_DICTIONARY_PUBLISHER_BRIDGE_ENABLED',
            'GLOBAL_DICTIONARY_SENSE_SRS_WRITE_ENABLED']){
            assert.notEqual(c.vars[flag],'true');
          }
          console.log('P0_SIGNER_STAGING_TARGET_AND_NO_SRS_WRITE_CHECKED');
          NODE
      - name: Verify real Ed25519 OPS binding and local flow in SQLite
        run: |
          set -euo pipefail
          node --experimental-sqlite --test tests/v12-ops-dictionary-publisher-bridge.test.mjs
          node --test tests/v12-ops-publisher-local-onboarding.test.mjs
          npm run check
      - name: Install isolated Wrangler CLI
        run: npm install --ignore-scripts --no-save wrangler@^4
      - name: Test-only D1 role, schema and pinned key collision check (READ ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_D1_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PIN: ${{ inputs.public_key_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?MISSING_STAGING_READ_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?MISSING_ACCOUNT_ID}"
          umask 077
          sql="SELECT
            (SELECT count(*) FROM sqlite_master WHERE type='table'
              AND name IN ('ops_operators','ops_audit_events',
              'ops_dictionary_publisher_keys','ops_dictionary_publisher_receipts')) ops_tables,
            (SELECT count(*) FROM ops_operators WHERE role='publisher'
              AND environment='staging' AND is_active=1 AND revoked_at IS NULL) publishers,
            (SELECT count(*) FROM ops_dictionary_publisher_keys
              WHERE is_active=1 AND revoked_at IS NULL
                AND public_key_sha256 <> '$PIN') conflicting_keys;"
          if ! npx wrangler d1 execute miaowu-english-test --remote --json \
             --config wrangler.jsonc --command "$sql" \
             > "$RUNNER_TEMP/publisher-safe-counts.json" \
             2>"$RUNNER_TEMP/publisher-private-error"; then
             echo 'P0_SIGNER_REAL_TEST_D1_READONLY_UNAVAILABLE'; exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync(process.env.RUNNER_TEMP+
            '/publisher-safe-counts.json','utf8'));
          const rows=(Array.isArray(data)?data:[data]).flatMap(x=>x.results||[]);
          assert.equal(rows.length,1);
          assert.equal(rows[0].ops_tables,4,'P0_SIGNER_021_SCHEMA_REQUIRED');
          assert.ok(rows[0].publishers>=1,'P0_SIGNER_ACTIVE_REAL_OPS_PUBLISHER_REQUIRED');
          assert.equal(rows[0].conflicting_keys,0,'P0_SIGNER_ACTIVE_TRUST_KEY_CONFLICT');
          console.log('P0_SIGNER_REAL_TEST_EXISTING_PUBLISHER_AND_SCHEMA_READY');
          NODE
          rm -f "$RUNNER_TEMP/publisher-safe-counts.json" "$RUNNER_TEMP/publisher-private-error"
      - name: Generate TEST-only runtime config with public pin; preserve SRS write disabled
        env:
          PIN: ${{ inputs.public_key_fingerprint }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          const pin=process.env.PIN;
          assert.match(pin,/^[a-f0-9]{64}$/u);
          assert.equal(config.name,'miaowu-english-staging');
          assert.equal(config.d1_databases[0].database_id,'88a817cb-23bb-4ae4-bcb8-92286c4165d4');
          config.vars={...config.vars,
           GLOBAL_DICTIONARY_SENSE_SRS_ENABLED:'true',
           GLOBAL_DICTIONARY_PUBLISHED_LEGACY_PREVIEW_ENABLED:'true',
           GLOBAL_DICTIONARY_SENSE_SRS_WRITE_ENABLED:'false',
           OPS_DICTIONARY_PUBLISHER_BRIDGE_ENABLED:'true',
           MIAOWU_TRUSTED_OPS_PUBLISHER_PUBKEY_SHA256:pin};
          writeFileSync('wrangler.ops-signer.generated.jsonc',
            JSON.stringify(config,null,2)+'\n',{flag:'wx',mode:0o600});
          console.log('P0_SIGNER_TEST_ONLY_CONFIG_GENERATED_PUBLIC_FINGERPRINT_NO_PRIVATE_KEY');
          NODE
      - name: Deploy only isolated staging Worker (no migration, no dictionary writes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?MISSING_STAGING_DEPLOY_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?MISSING_ACCOUNT_ID}"
          npx wrangler deploy --keep-vars --config wrangler.ops-signer.generated.jsonc
          echo 'P0_SIGNER_STAGING_WORKER_DEPLOYED_BRIDGE_ENABLED_NOT_AUTOMATICALLY_AUTHORIZED'
      - name: Smoke anonymous remains blocked and only staging URL responds
        run: |
          set -euo pipefail
          url='https://miaowu-english-staging.kim10086a.workers.dev'
          for path in / /api/ops/dictionary/publisher-key/register; do
            status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 25 \
              --request POST "$url$path")"
            test "$status" = 401
          done
          echo 'P0_SIGNER_STAGING_PROTECTED_PREVIEW_401_NO_CONTENT_OR_PUBLISH'
      - name: Delete generated public trust config
        if: always()
        run: rm -f wrangler.ops-signer.generated.jsonc
