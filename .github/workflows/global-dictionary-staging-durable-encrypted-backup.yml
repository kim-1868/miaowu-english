name: Dictionary staging D1 encrypted persistent backup (NO remote writes)
on:
  push:
    branches: [feature/v11-smart-vocab-preflight-20261109]
    paths:
      - .github/workflows/global-dictionary-staging-durable-encrypted-backup.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-dictionary-encrypted-backup
  cancel-in-progress: false
jobs:
  backup-test-d1:
    if: github.repository == 'kim-1868/miaowu-english' && github.ref == 'refs/heads/feature/v11-smart-vocab-preflight-20261109'
    environment:
      name: staging-d1-schema-approval
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact staging database identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const cfg=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          assert.equal(cfg.name,'miaowu-english-staging');
          assert.equal(cfg.vars.APP_ENV,'staging');
          assert.equal(cfg.d1_databases.length,1);
          assert.equal(cfg.d1_databases[0].database_name,'miaowu-english-test');
          assert.equal(cfg.d1_databases[0].database_id,'88a817cb-23bb-4ae4-bcb8-92286c4165d4');
          console.log('ENCRYPTED_BACKUP_STAGING_DATABASE_ALLOWLIST_OK');
          NODE
      - name: Install Wrangler for staging export only
        run: npm install --ignore-scripts --no-save wrangler@^4
      - name: Full remote export, encrypt, decrypt and independently restore offline
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_D1_WRITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_PASSPHRASE: ${{ secrets.STAGING_D1_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?MISSING_STAGING_D1_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?MISSING_ACCOUNT_ID}"
          : "${BACKUP_PASSPHRASE:?MISSING_STAGING_D1_BACKUP_PASSPHRASE}"
          test "${#BACKUP_PASSPHRASE}" -ge 32 || { echo 'BACKUP_PASSPHRASE_TOO_SHORT'; exit 1; }
          umask 077
          private="$RUNNER_TEMP/miaowu-d1-backup-private"
          mkdir -m 700 "$private"
          trap 'rm -rf "$private"' EXIT
          printf '%s' "$BACKUP_PASSPHRASE" > "$private/passphrase"
          backup="$private/staging-d1-full.sql"
          decrypted="$private/decrypted.sql"
          restored="$private/independent.sqlite"
          encrypted="$RUNNER_TEMP/miaowu-staging-d1-encrypted-backup.gpg"
          # The only uploaded artifact file is encrypted; never output raw SQL.
          npx wrangler d1 export miaowu-english-test --remote --skip-confirmation \
            --config wrangler.jsonc --output "$backup" >/dev/null
          test -s "$backup"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$private/passphrase" --symmetric --cipher-algo AES256 \
            --output "$encrypted" "$backup"
          test -s "$encrypted"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$private/passphrase" --decrypt \
            --output "$decrypted" "$encrypted" >/dev/null 2>&1
          cmp "$backup" "$decrypted"
          sqlite3 "$restored" < "$decrypted" >/dev/null
          test "$(sqlite3 "$restored" 'PRAGMA integrity_check;')" = "ok"
          test -z "$(sqlite3 "$restored" 'PRAGMA foreign_key_check;')"
          for t in books words user_words chapter_words; do
            test "$(sqlite3 "$restored" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='$t';")" = "1"
          done
          test "$(sqlite3 "$restored" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name LIKE 'global_dictionary_%';")" = 0
          echo 'STAGING_ENCRYPTED_EXPORT_DECRYPT_AND_RESTORE_VERIFIED'
          echo 'STAGING_INDEPENDENT_SQLITE_INTEGRITY_AND_FK_OK'
          echo 'NO_REMOTE_D1_WRITE_NO_REMOTE_RESTORE_NO_DEPLOYMENT'
      - name: Publish ONLY encrypted backup (30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: miaowu-staging-d1-encrypted-backup
          path: ${{ runner.temp }}/miaowu-staging-d1-encrypted-backup.gpg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Remove encrypted backup from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/miaowu-staging-d1-encrypted-backup.gpg"
