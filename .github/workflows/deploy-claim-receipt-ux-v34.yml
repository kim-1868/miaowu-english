name: Publish Miaowu buyer claim receipt UX V34
on:
  push:
    branches: [release/claim-receipt-ux-v34-20261105]
    paths: [.github/workflows/deploy-claim-receipt-ux-v34.yml]
permissions:
  contents: read
concurrency:
  group: miaowu-production-worker-deploy
  cancel-in-progress: false
jobs:
  receipt-ux-release:
    if: ${{ github.repository == 'kim-1868/miaowu-english' && github.ref == 'refs/heads/release/claim-receipt-ux-v34-20261105' }}
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - name: Checkout immutable tested V34 revision
        uses: actions/checkout@v4
        with:
          ref: f67acf737a426cd44a65930e0a03e486714ad3ee
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact static-only changes, existing production binding and no DB migrations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f67acf737a426cd44a65930e0a03e486714ad3ee"
          grep -Fq '"name": "miaowu-english-production"' deploy/production.wrangler.jsonc
          grep -Fq '"database_name": "miaowu-english-prod"' deploy/production.wrangler.jsonc
          git diff --name-only 9902fde468b491994091a2d10356f867bbbfe6e1 HEAD | sort > /tmp/changed
          printf '%s\n'             .github/workflows/test-claim-ux-v34.yml             public/claim.css public/claim.html public/claim.js             tests/s160-claim-receipt-ux.test.mjs | sort > /tmp/approved
          diff -u /tmp/approved /tmp/changed
          test ! -e private-output
          test ! -e private-input
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression suite and production assets
        run: |
          set -euo pipefail
          node --check public/claim.js
          npm run check
          npm test
          node scripts/check-production-config.mjs deploy/production.wrangler.jsonc
          npm run assets:production:build
          grep -Fq 'id="copyVoucherHint"' dist-production/public/claim.html
          grep -Fq '小红书-订单编号' dist-production/public/claim.html
          ! grep -Fq '后台会进行人工对账' dist-production/public/claim.html
      - name: Install Cloudflare deploy tool without lifecycle scripts
        run: npm install --no-save --ignore-scripts wrangler@^4
      - name: Dry-run deployment
        run: npx wrangler deploy --dry-run --config deploy/production.wrangler.jsonc
      - name: Check existing buyer page and reader before replacement
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 25 https://miaowu-english-pages.pages.dev/claim -o /tmp/claim-before
          grep -Fq '小红书-订单编号' /tmp/claim-before
          curl -fsSL --retry 3 --max-time 25 https://miaowu-english-pages.pages.dev/ -o /tmp/home-before
          grep -Fq 'v31-word-only' /tmp/home-before
      - name: Confirm Cloudflare Worker credential present
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          test "$HAS_TOKEN" = "true"
          test "$HAS_ACCOUNT" = "true"
      - name: Deploy tested visual-only receipt update and preserve secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars --config deploy/production.wrangler.jsonc
      - name: Verify live buyer page, scripts, guarded publisher endpoint and reader
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            curl -fsSL --max-time 20 "https://miaowu-english-pages.pages.dev/claim?receiptv34=$i" -o /tmp/claim-after || true
            if grep -Fq 'id="copyVoucherHint"' /tmp/claim-after; then break; fi
            sleep 3
          done
          grep -Fq 'id="copyVoucherHint"' /tmp/claim-after
          grep -Fq '小红书-订单编号' /tmp/claim-after
          grep -Fq '账号找回备用凭证' /tmp/claim-after
          ! grep -Fq '后台会进行人工对账' /tmp/claim-after
          curl -fsSL --retry 3 --max-time 25 https://miaowu-english-pages.pages.dev/claim.js -o /tmp/claim-js
          grep -Fq '已复制！现在可以前往妙屋英语' /tmp/claim-js
          curl -fsSL --retry 3 --max-time 25 https://miaowu-english-pages.pages.dev/api/claim/categories -o /tmp/claim-catalog
          node --input-type=module -e 'import fs from "node:fs";const d=JSON.parse(fs.readFileSync("/tmp/claim-catalog","utf8"));if(!d.enabled||!Array.isArray(d.categories))process.exit(1)'
          guest=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://miaowu-english-pages.pages.dev/api/ops/claims/query -H 'Origin: https://miaowu-english-pages.pages.dev' -H 'Content-Type: application/json' -d '{"page":1}')
          test "$guest" = "401"
          curl -fsSL --retry 3 --max-time 25 https://miaowu-english-pages.pages.dev/ -o /tmp/home-after
          grep -Fq 'v31-word-only' /tmp/home-after
