# One-time, user-requested production UI release. No D1 migrations or content writes.
name: Publish Miaowu responsive bookshelf (one-time)
run-name: Publish responsive bookshelf · 7e6d5aa61e87
on:
  push:
    branches:
      - release/one-shot-bookshelf-20261104
    paths:
      - '.github/workflows/deploy-bookshelf-20261104.yml'
permissions:
  contents: read
concurrency:
  group: miaowu-production-worker-deploy
  cancel-in-progress: false
jobs:
  production-ui-only:
    if: ${{ github.repository == 'kim-1868/miaowu-english' && github.ref == 'refs/heads/release/one-shot-bookshelf-20261104' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed fixed SHA
        uses: actions/checkout@v4
        with:
          ref: 7e6d5aa61e870c851dbde894a975bbceb650ae8f
          persist-credentials: false
      - name: Fail closed unless precise release and production target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7e6d5aa61e870c851dbde894a975bbceb650ae8f"
          grep -Fq '"name": "miaowu-english-production"' deploy/production.wrangler.jsonc
          grep -Fq '"database_name": "miaowu-english-prod"' deploy/production.wrangler.jsonc
          test ! -e private-output
          test ! -e private-input
      - name: Node and Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler without project install hooks
        run: npm install --no-save --ignore-scripts wrangler@^4
      - name: Syntax, tests, production config and assets
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
          node scripts/check-production-config.mjs deploy/production.wrangler.jsonc
          npm run assets:production:build
          grep -Fq 'compact, responsive story bookshelf' dist-production/public/styles.css
          grep -Fq '20261104-v20-bookshelf-grid' dist-production/public/index.html
          test -f dist-production/public/app.js
          npx wrangler deploy --dry-run --config deploy/production.wrangler.jsonc --outdir .wrangler/dryrun-production
      - name: Guard existing live V19 site and production proxy before overwrite
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 https://miaowu-english-pages.pages.dev/styles.css -o /tmp/current-miaowu.css
          grep -Fq 'S147: publisher-managed translucent cover labels' /tmp/current-miaowu.css
          if grep -Fq 'compact, responsive story bookshelf' /tmp/current-miaowu.css; then
            echo 'Online version already includes responsive bookshelf; refusing redundant deploy'
            exit 1
          fi
          curl -fsSL --retry 3 --max-time 30 https://miaowu-english-pages.pages.dev/__miaowu_prod_edge_probe -o /tmp/edge.json
          node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync("/tmp/edge.json","utf8"));if(!x.ok||!x.productionBindingPresent) process.exit(1)'
      - name: Require pre-configured production credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          test "$HAS_TOKEN" = "true" || { echo "Missing Cloudflare deployment token"; exit 1; }
          test "$HAS_ACCOUNT" = "true" || { echo "Missing Cloudflare account ID"; exit 1; }
      - name: Deploy UI bundle to existing production Worker (keep variables)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars --config deploy/production.wrangler.jsonc
      - name: Check actual production CSS, HTML and routing after deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            curl -fsSL --retry 2 --max-time 20 "https://miaowu-english-pages.pages.dev/styles.css?bookshelf-check=$i" -o /tmp/live-grid.css || true
            if grep -Fq 'compact, responsive story bookshelf' /tmp/live-grid.css; then break; fi
            sleep 5
          done
          grep -Fq 'compact, responsive story bookshelf' /tmp/live-grid.css
          curl -fsSL --retry 4 --max-time 30 https://miaowu-english-pages.pages.dev/ -o /tmp/live-home.html
          grep -Fq '20261104-v20-bookshelf-grid' /tmp/live-home.html
          curl -fsSL --retry 3 --max-time 30 https://miaowu-english-pages.pages.dev/__miaowu_prod_edge_probe -o /tmp/edge-after.json
          node --input-type=module -e 'import fs from "node:fs";const x=JSON.parse(fs.readFileSync("/tmp/edge-after.json","utf8"));if(!x.ok||!x.productionBindingPresent)process.exit(1)'
