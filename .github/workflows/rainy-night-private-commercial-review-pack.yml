# All editorial material stays in private Actions artifacts. Nothing is deployed.
name: Prepare Rainy Night private commercial review package
on:
  push:
    branches:
      - editorial/rainy-night-release-review-pack-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed offline tools only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: eSpeak independent British IPA draft reference
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak >/dev/null
      - name: Generate complete PRIVATE editorial inputs
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/s115-rainy-night-ipa-ai-working-copy.test.mjs tests/s116-ipa-review-handoff.test.mjs tests/s113-rainy-night-sentence-review-queue.test.mjs tests/s117-offline-review-tools.test.mjs
          node scripts/prepare-rainy-night-ipa-ai-working-copy.mjs --write-private
          node scripts/prepare-rainy-night-ipa-review-handoff.mjs private-output/rainy-night-188-IPA-AI-DRAFT-NEEDS-REVIEW.json
          node scripts/assemble-rainy-night-high-density-review-draft.mjs --write-private
          node scripts/build-rainy-night-private-sentence-review.mjs --write-private
          mkdir -p private-output/commercial-review-pack
          cp tools/rainy-night-ipa-offline-review.html private-output/commercial-review-pack/
          cp tools/rainy-night-story-offline-review.html private-output/commercial-review-pack/
          cp docs/RAINY_NIGHT_FINAL_REVIEW_HANDOFF_20261103.md private-output/commercial-review-pack/README.md
          cp private-output/rainy-night-188-IPA-AI-DRAFT-NEEDS-REVIEW.json private-output/commercial-review-pack/
          cp private-output/rainy-night-188-IPA-PREFILLED-OWNER-SIGNOFF-REQUIRED.json private-output/commercial-review-pack/
          cp private-output/rainy-night-12-chapter-high-density-UNREVIEWED.json private-output/commercial-review-pack/
          cp private-output/rainy-night-sentences-REVIEW-ONLY.json private-output/commercial-review-pack/
      - name: Integrity assertions and release blocker manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from "node:fs";
          import assert from "node:assert/strict";
          import {createHash} from "node:crypto";
          const home="private-output/commercial-review-pack/";
          const read=name=>JSON.parse(readFileSync(home+name,"utf8"));
          const ipa=read("rainy-night-188-IPA-PREFILLED-OWNER-SIGNOFF-REQUIRED.json");
          const draft=read("rainy-night-12-chapter-high-density-UNREVIEWED.json");
          const queue=read("rainy-night-sentences-REVIEW-ONLY.json");
          const digest=s=>createHash("sha256").update(s).digest("hex");
          assert.equal(draft.chapters.length,12);
          assert.equal(draft.words.length,188);
          assert.equal(draft.book.category,"cet4");
          assert.ok(draft.chapters.every(ch=>ch.preview===false));
          const anchors=draft.chapters.reduce((n,ch)=>n+ch.paragraphs.reduce((m,p)=>m+p.segments.filter(s=>s.wordId).length,0),0);
          assert.equal(anchors,1892);
          assert.equal(ipa.rows.length,188);
          assert.ok(ipa.rows.every(x=>x.phoneticUk&&x.phoneticUs));
          assert.ok(ipa.rows.every(x=>x.commercialUseConfirmed===false&&!x.reviewedBy&&!x.reviewedAt));
          assert.equal(ipa.bookId,draft.book.id);
          assert.equal(queue.bookId,draft.book.id);
          assert.equal(queue.totalIssues,337);
          assert.equal(queue.reviewRows.length,337);
          assert.equal(queue.allowedToPublish,false);
          const manifest={
           bookId:draft.book.id,chapters:12,wordCards:188,proposedAnchors:anchors,
           noFreePreview:true,unresolvedSentenceReviewRows:queue.totalIssues,
           wordCardsWithRealHumanSignoff:0,
           editorialStatus:"PRIVATE_REVIEW_PACK_NOT_APPROVED_NOT_PUBLISHED",
           requires:["rights_review","language_proofreading","editorial_sense_ipa_signoff",
                     "version_locked_d1_draft_update","ops_approval","protected_reader_qa"],
           integrity:{
            ipaSourceDigest:ipa.sourceDigest,manuscriptReviewDigest:queue.sourceDigest,
            ipaFormSHA256:digest(readFileSync(home+"rainy-night-188-IPA-PREFILLED-OWNER-SIGNOFF-REQUIRED.json","utf8")),
            manuscriptSHA256:digest(readFileSync(home+"rainy-night-12-chapter-high-density-UNREVIEWED.json","utf8"))
           },productionD1Touched:false,publicAssetDeployed:false,
           buyerAccessOpened:false
          };
          writeFileSync(home+"release-review-summary.json",JSON.stringify(manifest,null,2)+"\n");
          console.log("RAINY_NIGHT_PRIVATE_RELEASE_PACK "+JSON.stringify({
           chapters:manifest.chapters,wordCards:manifest.wordCards,
           proposedAnchors:manifest.proposedAnchors,sentenceReviewRows:queue.totalIssues,
           realHumanSignoffs:0,productionD1Touched:false
          }));
          JS
      - name: Upload buyer-protected novel and review tools privately
        uses: actions/upload-artifact@v4
        with:
          name: RAINY-NIGHT-PRIVATE-FINAL-REVIEW-PACK-NOT-PUBLISHED
          path: private-output/commercial-review-pack/
          retention-days: 30
          if-no-files-found: error
