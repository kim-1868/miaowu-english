# Read-only production release diagnosis. No D1 mutations, publication or customer records.
name: Rainy Night production editorial gate audit (read-only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-rainy-night-release-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 981b6ea9ecbcbb78a5365f810052d2ed15f19396
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts wrangler@^4
      - name: Read production D1 aggregate book readiness only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          QUERY="SELECT (SELECT COUNT(*) FROM books WHERE id='rainy-night-archives-cet4-v1' AND status='draft') draft_books, (SELECT COUNT(*) FROM books WHERE id='rainy-night-archives-cet4-v1' AND status='published') published_books, (SELECT COUNT(*) FROM chapters WHERE book_id='rainy-night-archives-cet4-v1') chapters, (SELECT COUNT(*) FROM chapters WHERE book_id='rainy-night-archives-cet4-v1' AND is_preview=1) free_chapters, (SELECT COUNT(*) FROM chapters WHERE book_id='rainy-night-archives-cet4-v1' AND published_at IS NOT NULL) published_chapters, (SELECT COUNT(*) FROM chapter_words cw JOIN chapters ch ON cw.chapter_id=ch.id WHERE ch.book_id='rainy-night-archives-cet4-v1') word_anchors, (SELECT COUNT(*) FROM ops_operators WHERE environment='production' AND role='publisher' AND is_active=1 AND revoked_at IS NULL) valid_publisher_records, (SELECT COUNT(*) FROM ops_book_content_versions WHERE book_id='rainy-night-archives-cet4-v1') version_rows, (SELECT COUNT(*) FROM ops_publication_approvals WHERE book_id='rainy-night-archives-cet4-v1') approval_rows, (SELECT COUNT(*) FROM words w WHERE w.id IN (SELECT DISTINCT cw.word_id FROM chapter_words cw JOIN chapters c ON cw.chapter_id=c.id WHERE c.book_id='rainy-night-archives-cet4-v1') AND (COALESCE(TRIM(w.phonetic_uk),'')='' OR COALESCE(TRIM(w.phonetic_us),'')='')) missing_ipa, (SELECT COUNT(*) FROM words w WHERE w.id IN (SELECT DISTINCT cw.word_id FROM chapter_words cw JOIN chapters c ON cw.chapter_id=c.id WHERE c.book_id='rainy-night-archives-cet4-v1') AND COALESCE(TRIM(w.part_of_speech),'')='') missing_pos, (SELECT COUNT(*) FROM words w WHERE w.id IN (SELECT DISTINCT cw.word_id FROM chapter_words cw JOIN chapters c ON cw.chapter_id=c.id WHERE c.book_id='rainy-night-archives-cet4-v1') AND (COALESCE(TRIM(w.example_en),'')='' OR COALESCE(TRIM(w.example_zh),'')='')) missing_examples"
          npx wrangler d1 execute miaowu-english-prod --remote --json --config deploy/production.wrangler.jsonc --command "$QUERY" > /tmp/miaowu-readonly-audit.json
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          import assert from "node:assert/strict";
          const response=JSON.parse(readFileSync("/tmp/miaowu-readonly-audit.json","utf8"));
          const r=(Array.isArray(response)?response:[response]).flatMap(x=>x.results||[])[0];
          assert.ok(r,"Missing remote D1 result");
          const keys=["draft_books","published_books","chapters","free_chapters","published_chapters","word_anchors","valid_publisher_records","version_rows","approval_rows","missing_ipa","missing_pos","missing_examples"];
          for(const key of keys)assert.ok(Number.isSafeInteger(Number(r[key]))&&Number(r[key])>=0,"Invalid aggregate: "+key);
          console.log("RAINY_NIGHT_RELEASE_READINESS_AGGREGATES "+JSON.stringify(Object.fromEntries(keys.map(k=>[k,Number(r[k])]))));
          assert.equal(Number(r.chapters),12,"Unexpected production chapter count");
          assert.equal(Number(r.free_chapters),0,"Do not expose preview chapter");
          JS
