name: V1.1 preview isolation preflight (read-only)
run-name: V1.1 staging preview read-only checks

on:
  push:
    branches:
      - feature/v11-preview-environment-20261106
    paths:
      - .github/workflows/v11-preview-preflight.yml
      - scripts/check-v11-preview-config.mjs
      - tests/v11-preview-isolation.test.mjs
      - wrangler.jsonc
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v11-preview-preflight-readonly
  cancel-in-progress: true

jobs:
  verify:
    name: Verify preview isolation, tests and existing Worker secrets
    if: github.repository == 'kim-1868/miaowu-english' && github.ref == 'refs/heads/feature/v11-preview-environment-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact proposed preview commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate staging-only D1 and project syntax
        run: |
          set -euo pipefail
          node scripts/check-v11-preview-config.mjs
          npm run check
      - name: Run complete regression suite including isolated preview guards
        run: npm test
      - name: Install Wrangler without lifecycle scripts
        run: npm install --no-save --ignore-scripts wrangler@^4
      - name: Compile preview Worker without deployment
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler.jsonc --outdir .wrangler/dryrun-v11-preview
      - name: Require existing Cloudflare credentials for read-only staging check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          test "$HAS_TOKEN" = true || { echo "::error::Cloudflare token unavailable for staging checks"; exit 1; }
          test "$HAS_ACCOUNT" = true || { echo "::error::Cloudflare account unavailable for staging checks"; exit 1; }
      - name: Inspect preview Worker secret names without modifying anything
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-v11-preview-config.mjs
          npx wrangler secret list --config wrangler.jsonc --format json > /tmp/v11-preview-secret-names.json
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const value=JSON.parse(readFileSync("/tmp/v11-preview-secret-names.json","utf8"));
            if (!Array.isArray(value)) throw Error("STAGING_SECRET_LIST_UNEXPECTED");
            const names=new Set(value.map(item=>item.name));
            for (const name of ["STAGING_PREVIEW_PASSWORD","ACTIVATION_PEPPER"])
              if(!names.has(name))throw Error("STAGING_REQUIRED_SECRET_MISSING: "+name);
            console.log("PREVIEW_SECRETS_PRESENT_NAME_CHECK_ONLY");
          '
          echo "PREVIEW_PREFLIGHT_OK_NO_DEPLOYMENT"
