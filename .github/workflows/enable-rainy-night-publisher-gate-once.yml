# One-time owner-authorized production publisher gate enablement.
# This NEVER publishes a book, touches D1 customer tables, or writes user credentials.
name: Enable Miaowu authenticated publishing gate (once)
on:
  push:
    branches: [main]
    paths: [.github/workflows/enable-rainy-night-publisher-gate-once.yml]
permissions:
  contents: read
concurrency:
  group: miaowu-publisher-gate
  cancel-in-progress: false
jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fixed deployed Worker config
        uses: actions/checkout@v4
        with:
          ref: 4a49a3795c43bf20001ed947810dc8d9dea34bfc
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler and check production target
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts wrangler@^4 >/dev/null
          node scripts/check-production-config.mjs deploy/production.wrangler.jsonc
          grep -Fq '"name": "miaowu-english-production"' deploy/production.wrangler.jsonc
          grep -Fq '"database_name": "miaowu-english-prod"' deploy/production.wrangler.jsonc
      - name: Check existing publisher and paid-only book before enabling release
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute miaowu-english-prod --remote --json --config deploy/production.wrangler.jsonc             --command "SELECT (SELECT COUNT(*) FROM books WHERE id='rainy-night-archives-cet4-v1' AND status='draft') drafts, (SELECT COUNT(*) FROM chapters WHERE book_id='rainy-night-archives-cet4-v1') chapters, (SELECT COUNT(*) FROM chapters WHERE book_id='rainy-night-archives-cet4-v1' AND is_preview=1) previews, (SELECT COUNT(*) FROM ops_operators WHERE role='publisher' AND environment='production' AND is_active=1 AND revoked_at IS NULL) publishers, (SELECT COUNT(*) FROM ops_publication_approvals WHERE book_id='rainy-night-archives-cet4-v1') approvals" > /tmp/rainy-publisher-gate-before.json
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const d=JSON.parse(readFileSync("/tmp/rainy-publisher-gate-before.json","utf8"));
          const r=(Array.isArray(d)?d:[d]).flatMap(x=>x.results||[])[0];
          assert.equal(Number(r?.drafts),1);
          assert.equal(Number(r?.chapters),12);
          assert.equal(Number(r?.previews),0);
          assert.ok(Number(r?.publishers)>=1);
          console.log("PUBLISHER_GATE_PREFLIGHT "+JSON.stringify({drafts:Number(r.drafts),chapters:Number(r.chapters),previews:Number(r.previews),approvedRecords:Number(r.approvals),authorizedPublishers:Number(r.publishers)}));
          JS
      - name: Enable manual publisher review via Cloudflare Worker secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          printf 'true' | npx wrangler secret put OPS_PUBLICATION_ENABLED --config deploy/production.wrangler.jsonc > /tmp/mw-gate-secret-put.log 2>&1 ||
            { echo "PUBLISHER_GATE_ENABLE_FAILED; no direct D1 writes or publishing attempted."; tail -c 1000 /tmp/mw-gate-secret-put.log; exit 1; }
          npx wrangler secret list --config deploy/production.wrangler.jsonc > /tmp/mw-secret-names.json
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          import assert from "node:assert/strict";
          const list=JSON.parse(readFileSync("/tmp/mw-secret-names.json","utf8"));
          assert.ok(Array.isArray(list)&&list.some(x=>x.name==="OPS_PUBLICATION_ENABLED"),"Gate binding missing");
          console.log("PUBLISHER_GATE_ENABLED_AS_WORKER_SECRET - book is still DRAFT; publisher must click Save approval and Confirm publication.");
          JS
