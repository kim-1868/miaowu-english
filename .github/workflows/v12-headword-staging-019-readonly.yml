name: V1.2 test D1 019 readiness READ ONLY (requires approval)
on:
  push:
    branches: [feature/v11-smart-vocab-preflight-20261109]
    paths:
      - .github/workflows/v12-headword-staging-019-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v12-headword-staging-019-read-only
  cancel-in-progress: false
jobs:
  current-staging-baseline:
    if: >-
      github.repository == 'kim-1868/miaowu-english' &&
      github.ref == 'refs/heads/feature/v11-smart-vocab-preflight-20261109'
    environment:
      name: staging-d1-schema-approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hard-lock D1 target identity and prevent live rollout
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          assert.equal(x.name,'miaowu-english-staging');
          assert.equal(x.vars.APP_ENV,'staging');
          assert.equal(x.d1_databases.length,1);
          assert.equal(x.d1_databases[0].database_name,'miaowu-english-test');
          assert.equal(x.d1_databases[0].database_id,'88a817cb-23bb-4ae4-bcb8-92286c4165d4');
          console.log('EXACT_TEST_D1_ONLY_NO_PRODUCTION');
          NODE
      - name: Install isolated Wrangler CLI for SELECT only
        run: npm install --no-save --ignore-scripts wrangler@^4
      - name: Query only schema and anonymous counts, no export/no DML
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_D1_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?STAGING_READ_SECRET_MISSING}"
          : "${CLOUDFLARE_ACCOUNT_ID:?STAGING_ACCOUNT_ID_MISSING}"
          umask 077
          result="$RUNNER_TEMP/headword-019-readonly-counts.json"
          fk="$RUNNER_TEMP/headword-019-readonly-fk.json"
          integrity="$RUNNER_TEMP/headword-019-readonly-integrity.json"
          private_error="$RUNNER_TEMP/headword-019-private-wrangler-stderr.log"
          trap 'rm -f "$result" "$fk" "$integrity" "$private_error"' EXIT
          sql="SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name LIKE 'global_dictionary_%') AS dictionary_tables,(SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('global_dictionary_bindings_draft_guard','global_dictionary_sense_identity_guard','global_dictionary_legacy_sense_link_guard','global_dictionary_legacy_sense_link_no_repoint','global_dictionary_book_sense_guard')) AS dictionary_triggers,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('books','words','user_words','chapter_words')) AS core_tables,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('user_headword_study','user_headword_review_events')) AS headword_019_tables,(SELECT COUNT(*) FROM global_dictionary_entries) AS candidate_heads,(SELECT COUNT(*) FROM global_dictionary_forms) AS candidate_forms,(SELECT COUNT(*) FROM global_dictionary_lessons) AS lessons,(SELECT COUNT(*) FROM global_dictionary_senses WHERE approved=1) AS approved_senses,(SELECT COUNT(*) FROM global_dictionary_entries WHERE teaching_ready=1) AS teaching_ready ,(SELECT COUNT(*) FROM global_dictionary_sources WHERE enabled=1) AS active_sources,(SELECT COUNT(*) FROM global_dictionary_entries WHERE source_name='upstream_ecdict_unverified') AS upstream_heads,(SELECT COUNT(*) FROM global_dictionary_entries WHERE source_name!='upstream_ecdict_unverified') AS other_heads,(SELECT COUNT(*) FROM global_dictionary_forms WHERE source_name='upstream_ecdict_unverified') AS upstream_forms,(SELECT COUNT(*) FROM global_dictionary_forms WHERE source_name!='upstream_ecdict_unverified') AS other_forms,(SELECT COUNT(*) FROM global_dictionary_sources WHERE source_key='upstream_ecdict_unverified' AND license_reviewed=0 AND enabled=0 AND imported_entries=11422 AND imported_forms=16442) AS original_import_source_intact;"
          readonly_query(){
            local step="$1"
            local statement="$2"
            local destination="$3"
            if ! npx wrangler d1 execute miaowu-english-test --remote \
              --config wrangler.jsonc --json --command "$statement" \
              > "$destination" 2> "$private_error"; then
              node scripts/staging-019-readonly-diagnostics.mjs \
                "$step" "$destination" "$private_error"
              exit 1
            fi
          }
          readonly_query COUNTS "$sql" "$result"
          readonly_query FK 'PRAGMA foreign_key_check;' "$fk"
          readonly_query INTEGRITY 'PRAGMA quick_check;' "$integrity"
          READ_COUNTS="$result" READ_FK="$fk" READ_INTEGRITY="$integrity" node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const read=name=>{
           let raw;
           try{raw=JSON.parse(readFileSync(process.env[name],'utf8'))}
           catch{throw Error('STAGING_READONLY_RESPONSE_NOT_VALID_JSON_'+name)}
           const packets=Array.isArray(raw)?raw:[raw];
           if(!packets.length||packets.some(p=>p?.success===false))
             throw Error('STAGING_READONLY_SQL_RESULT_UNSUCCESSFUL');
           return packets.flatMap(p=>p?.results??p?.result?.results??[]);
          };
          const count=read('READ_COUNTS');
          if(count.length!==1)throw Error('STAGING_SCALAR_COUNT_SHAPE_DRIFT');
          const x=count[0];
          // Only aggregate source totals: no word forms, headwords, book or
          // customer rows are logged. On drift, preserve fail-closed behavior
          // from deletion/corruption of the Nov 10 pinned upstream cohort.
          // The staging full-remainder cohort was explicitly imported and
          // verified in GitHub Actions run 42852308915 at 2026-11-10T16:18Z:
          // 11422 pre-import heads + exactly 50000 add-only heads = 61422,
          // 16442 forms; prior books, words, progress and chapter links intact.
          // Source registry imported_entries=11422 is deliberately kept as
          // the ORIGINAL upstream ECDICT index size, not updated to 61422.
          const observedKeys=[
           'candidate_heads','upstream_heads','other_heads',
           'candidate_forms','upstream_forms','other_forms',
           'original_import_source_intact'
          ];
          const observed={};
          for(const key of observedKeys){
           const value=Number(x[key]);
           if(!Number.isSafeInteger(value)||value<0||value>5000000)
             throw Error('STAGING_ANONYMOUS_COUNT_INVALID_'+key);
           observed[key]=value;
          }
          if(observed.upstream_heads+observed.other_heads!==observed.candidate_heads||
             observed.upstream_forms+observed.other_forms!==observed.candidate_forms)
             throw Error('STAGING_ANONYMOUS_COHORT_PARTITION_INCONSISTENT');
          console.log('STAGING_ANONYMOUS_DICTIONARY_TOTALS '+JSON.stringify(observed));
          const requireCount=(key,value)=>{
           if(!Number.isSafeInteger(Number(x[key]))||Number(x[key])!==value)
            throw Error('STAGING_HEADWORD_BASELINE_DRIFT_'+key);
          };
          for(const [key,value] of Object.entries({
           dictionary_tables:10,dictionary_triggers:5,core_tables:4,
           headword_019_tables:0,candidate_heads:61422,candidate_forms:16442,
           upstream_heads:61422,other_heads:0,
           upstream_forms:16442,other_forms:0,original_import_source_intact:1,
           lessons:0,approved_senses:0,teaching_ready:0,active_sources:0
          }))requireCount(key,value);
          if(read('READ_FK').length)throw Error('STAGING_FOREIGN_KEYS_INVALID');
          const integrity=read('READ_INTEGRITY');
          if(integrity.length!==1||integrity[0]?.quick_check!=='ok')
           throw Error('STAGING_REMOTE_QUICK_CHECK_FAILED');
          console.log('STAGING_EXISTING_013_018_SCHEMA_10_TABLES_5_TRIGGERS_OK');
          console.log('STAGING_VERIFIED_11422_EXAM_PLUS_50000_EXTRA_CANDIDATE_HEADS_61422_FORMS_16442_STILL_UNAPPROVED');
          console.log('STAGING_019_NOT_YET_APPLIED__SAFE_TO_PLAN_FRESH_BACKUP');
          console.log('STAGING_FK_QUICK_CHECK_READONLY_PASSED_NO_PERSONAL_ROWS_EXPORTED');
          console.log('FULL_INTEGRITY_CHECK_REQUIRES_SEPARATE_FRESH_BACKUP_LOCAL_RESTORE');
          console.log('STAGING_ZERO_REMOTE_WRITES_ZERO_DEPLOYMENT');
          NODE