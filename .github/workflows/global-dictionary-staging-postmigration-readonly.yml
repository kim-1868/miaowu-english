name: Dictionary staging D1 post-migration READ ONLY integrity audit
on:
  push:
    branches: [feature/v11-smart-vocab-preflight-20261109]
    paths:
      - .github/workflows/global-dictionary-staging-postmigration-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-dictionary-postmigration-audit
  cancel-in-progress: false
jobs:
  audit-staging-only:
    if: github.repository == 'kim-1868/miaowu-english' && github.ref == 'refs/heads/feature/v11-smart-vocab-preflight-20261109'
    environment:
      name: staging-d1-schema-approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify test D1 allowlist before querying
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const c=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          assert.equal(c.name,'miaowu-english-staging');
          assert.equal(c.vars.APP_ENV,'staging');
          assert.equal(c.d1_databases.length,1);
          assert.equal(c.d1_databases[0].database_name,'miaowu-english-test');
          assert.equal(c.d1_databases[0].database_id,'88a817cb-23bb-4ae4-bcb8-92286c4165d4');
          console.log('POSTMIGRATION_READONLY_TEST_D1_IDENTITY_OK');
          NODE
      - name: Install Wrangler
        run: npm install --ignore-scripts --no-save wrangler@^4
      - name: Read schema guard counts and anonymous historical row-count baselines
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_D1_WRITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?MISSING_STAGING_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?MISSING_ACCOUNT_ID}"
          umask 077
          private="$RUNNER_TEMP/miaowu-postmigration-readonly.json"
          trap 'rm -f "$private"' EXIT
          query="SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('books','words','user_words','chapter_words')) AS core_tables,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name LIKE 'global_dictionary_%') AS dictionary_tables,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('global_dictionary_bindings_draft_guard','global_dictionary_sense_identity_guard','global_dictionary_legacy_sense_link_guard','global_dictionary_legacy_sense_link_no_repoint','global_dictionary_book_sense_guard')) AS guard_triggers,
            (SELECT COUNT(*) FROM books) AS books_count,
            (SELECT COUNT(*) FROM words) AS words_count,
            (SELECT COUNT(*) FROM user_words) AS user_words_count,
            (SELECT COUNT(*) FROM chapter_words) AS chapter_words_count,
            (SELECT COUNT(*) FROM global_dictionary_entries) AS dictionary_entries_count,
            (SELECT COUNT(*) FROM global_dictionary_forms) AS dictionary_forms_count,
            (SELECT COUNT(*) FROM global_dictionary_lessons) AS reviewed_lessons_count,
            (SELECT COUNT(*) FROM global_dictionary_senses) AS senses_count,
            (SELECT COUNT(*) FROM global_dictionary_entries WHERE teaching_ready=1) AS ready_entries,
            (SELECT COUNT(*) FROM global_dictionary_sources WHERE enabled=1) AS enabled_sources;"
          npx wrangler d1 execute miaowu-english-test --remote --json \
            --config wrangler.jsonc --command "$query" >"$private"
          node --input-type=module - "$private" <<'NODE'
          import {readFileSync} from 'node:fs';
          const raw=JSON.parse(readFileSync(process.argv[2],'utf8'));
          const rows=(Array.isArray(raw)?raw:[raw]).flatMap(x=>x?.results||x?.result?.results||[]);
          if(rows.length!==1)throw Error('POSTMIGRATION_D1_RESULT_SHAPE_UNEXPECTED');
          const row=rows[0];
          const required=['core_tables','dictionary_tables','guard_triggers','books_count','words_count','user_words_count','chapter_words_count','dictionary_entries_count','dictionary_forms_count','reviewed_lessons_count','senses_count','ready_entries','enabled_sources'];
          for(const k of required) if(!Number.isSafeInteger(Number(row[k]))||Number(row[k])<0) throw Error('POSTMIGRATION_INVALID_COUNT_'+k);
          if(Number(row.core_tables)!==4||Number(row.dictionary_tables)!==10||Number(row.guard_triggers)!==5) throw Error('POSTMIGRATION_SCHEMA_GUARDS_MISSING');
          if(Number(row.ready_entries)!==0||Number(row.enabled_sources)!==0) throw Error('POSTMIGRATION_UNAPPROVED_PUBLICATION_DETECTED');
          if(Number(row.dictionary_entries_count)!==0||Number(row.dictionary_forms_count)!==0||Number(row.reviewed_lessons_count)!==0||Number(row.senses_count)!==0) throw Error('POSTMIGRATION_UNEXPECTED_PREIMPORT_DICTIONARY_DATA');
          console.log('STAGING_POSTMIGRATION_CORE_TABLES_4_DICTIONARY_TABLES_10_GUARD_TRIGGERS_5');
          console.log('STAGING_POSTMIGRATION_PREIMPORT_DICTIONARY_EMPTY_AND_PUBLICATION_DISABLED');
          console.log('STAGING_HISTORICAL_ANONYMOUS_ROW_COUNTS '+JSON.stringify({
            books:Number(row.books_count),words:Number(row.words_count),
            user_words:Number(row.user_words_count),chapter_words:Number(row.chapter_words_count)
          }));
          console.log('STAGING_POSTMIGRATION_READ_ONLY_NO_D1_WRITE_NO_DEPLOYMENT');
          NODE
