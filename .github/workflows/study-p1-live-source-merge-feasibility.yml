name: Study P1 PROD live-source safe 3way merge feasibility - NO DEPLOY
on:
  push:
    branches: [perf/study-interaction-20261117]
    paths: [.github/workflows/study-p1-live-source-merge-feasibility.yml]
permissions: {contents: read}
jobs:
  merge-readonly:
    if: github.repository == 'kim-1868/miaowu-english'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Recover original production Worker src from CURRENT source map (read only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          code=$(curl -fsSL --max-time 35 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -D /tmp/p1hdr -o /tmp/p1bundle -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/miaowu-english-production")
          test "$code" = 200
          python3 - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email import policy
          import json,hashlib
          headers=Path('/tmp/p1hdr').read_text(errors='replace')
          ct=next(line.strip().split(':',1)[1].strip() for line in headers.splitlines() if line.lower().startswith('content-type:'))
          msg=BytesParser(policy=policy.default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+Path('/tmp/p1bundle').read_bytes())
          parts=list(msg.iter_parts())
          print('PART_NAMES',[(p.get_filename(),len(p.get_payload(decode=True) or b'')) for p in parts])
          maps=[p for p in parts if (p.get_filename() or '').endswith('.map')]
          assert len(maps)==1,'Unable to identify one valid source map'
          sm=json.loads(maps[0].get_payload(decode=True))
          names=sm.get('sources',[])
          contents=sm.get('sourcesContent',[])
          print('SOURCEMAP_SOURCE_COUNT',len(names),'WITH_CONTENT',sum(x is not None for x in contents))
          assert len(contents)==len(names) and all(x is not None for x in contents),'MISSING_OR_INCOMPLETE_SOURCEMAP_SOURCES'
          good=[]
          for name,data in zip(names,contents):
              if name.startswith('../src/') and not ('..' in Path(name.removeprefix('../src/')).parts):
                  p=Path('/tmp/p1-live-source/src')/name.removeprefix('../src/')
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(data,encoding='utf8')
                  good.append(str(p.relative_to('/tmp/p1-live-source')))
          print('RESTORED_WORKER_SRC_COUNT',len(good))
          for name in ['src/worker.js','src/reading-library.js','src/echo-cloud.js','src/ops-import.js','src/ops-console.js','src/my-bookshelf.js']:
              p=Path('/tmp/p1-live-source')/name
              print('REQUIRED_PROD_MODULE',name,'present',p.exists(),'size',p.stat().st_size if p.exists() else 0)
              assert p.exists(),name
          PY
      - name: Fetch exact live public assets for 3-way merge baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1-live-source/public
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=['app.js','index.html','flashcards.js','flashcards.css','echo-cloud.js','ops-console.js','ops-console.css','ops.html','styles.css','sense-reader-bridge.js']
          for file in files:
              p=subprocess.run(['curl','-fsSL','--retry','2','--max-time','25',
                'https://miaowu-english-pages.pages.dev/'+file+'?safe_merge_check=20261117'],capture_output=True)
              if p.returncode:raise Exception('LIVE_ASSET_UNAVAILABLE_'+file)
              (Path('/tmp/p1-live-source/public')/file).write_bytes(p.stdout)
              print('LIVE_FILE',file,len(p.stdout))
          PY
      - name: Three-way merge only P1 changes onto latest actual production files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='af3ee6b3d7b7068e2501943bd8a5eff2673afea9'
          p1='0e7b9e9970a0cccb4169c1915f32b20df298b4be'
          files=['src/echo-cloud.js','public/app.js','public/index.html','public/flashcards.js','public/flashcards.css','public/echo-cloud.js']
          for file in files:
              live=Path('/tmp/p1-live-source')/file
              assert live.exists(),file
              if file=='public/index.html':
                  import re
                  text=live.read_text()
                  for asset,version in [('flashcards.css','20261117-interaction'),('echo-cloud.js','20261117-instant'),('flashcards.js','20261117-instant'),('app.js','20261117-live-merged-inplace')]:
                      expression=r'(/'+re.escape(asset)+r'\\?v=)[^"]+'
                      text,count=re.subn(expression,lambda m:m.group(1)+version,text)
                      assert count==1,('STATIC_CACHE_BUST_MISSING_OR_AMBIGUOUS',asset,count)
                  assert 'sense-reader-bridge.js' in text,'LIVE_SENSE_BRIDGE_MUST_SURVIVE'
                  dest=Path('/tmp/p1-proposed')/file
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_text(text)
                  print('MERGE_STATUS',file,'rc',0,'live_preserved',True,'cache_keys_updated',4)
                  continue
              original=subprocess.check_output(['git','show',f'{base}:{file}'])
              candidate=subprocess.check_output(['git','show',f'{p1}:{file}'])
              b=Path('/tmp/p1b');c=Path('/tmp/p1c')
              b.write_bytes(original);c.write_bytes(candidate)
              proc=subprocess.run(['git','merge-file','-p','--diff3',str(live),str(b),str(c)],capture_output=True)
              print('MERGE_STATUS',file,'rc',proc.returncode,'merged_bytes',len(proc.stdout),'conflict_count',proc.stdout.count(b'<<<<<<<'))
              if proc.returncode:
                  lines=proc.stdout.decode(errors='replace').splitlines()
                  ix=[i for i,s in enumerate(lines) if s.startswith('<<<<<<<')]
                  for i in ix[:3]:print('CONFLICT_PREVIEW',file,'\n'.join(lines[max(0,i-2):i+22])[:1200])
                  raise SystemExit('FAIL_CLOSED_CONFLICT_'+file)
              dest=Path('/tmp/p1-proposed')/file
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(proc.stdout)
          PY
          node --check /tmp/p1-proposed/public/app.js
          node --check /tmp/p1-proposed/public/flashcards.js
          node --check /tmp/p1-proposed/public/echo-cloud.js
          node --check /tmp/p1-proposed/src/echo-cloud.js
          echo SAFE_MERGE_FEASIBLE_NO_DEPLOY_NO_D1
