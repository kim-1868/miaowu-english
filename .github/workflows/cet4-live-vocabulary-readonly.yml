name: CET4 production vocabulary identity audit (read-only)
on:
  push:
    branches:
      - audit/cet4-live-vocabulary-readonly-20261105
    paths:
      - .github/workflows/cet4-live-vocabulary-readonly.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CF_D1_DATABASE: 649c71b3-340c-49bf-b806-3d39256851d3
    steps:
      - name: Read published CET4 word IDs and check cross-book reuse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request, urllib.error, json, sys, collections, unicodedata, itertools
          account=os.environ.get('CF_ACCOUNT','')
          token=os.environ.get('CF_D1_TOKEN','')
          db=os.environ['CF_D1_DATABASE']
          if not account or not token:
              sys.exit('Missing Cloudflare D1 read-only audit credential')
          sql = """
          SELECT DISTINCT b.id AS book_id, b.title AS book_title,
             w.id AS word_id, w.headword AS headword, w.part_of_speech AS pos, w.meaning_zh AS meaning
            FROM books b
            JOIN categories c ON c.id=b.category_id
            JOIN chapters ch ON ch.book_id=b.id
            JOIN chapter_words cw ON cw.chapter_id=ch.id
            JOIN words w ON w.id=cw.word_id
           WHERE c.slug='cet4' AND c.is_visible=1
             AND b.status='published'
             AND ch.published_at IS NOT NULL
             AND ch.published_at <= CURRENT_TIMESTAMP
           ORDER BY b.id, w.headword, w.id
          """
          url='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+db+'/query'
          body=json.dumps({'sql':sql}).encode('utf-8')
          req=urllib.request.Request(url,data=body,method='POST',
             headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=90) as response:
                  payload=json.loads(response.read())
          except urllib.error.HTTPError as err:
              sys.exit('D1 query HTTP '+str(err.code))
          if not payload.get('success') or not payload.get('result') or not payload['result'][0].get('success'):
              sys.exit('D1 query unsuccessful')
          rows=payload['result'][0].get('results',[])
          norm=lambda s: unicodedata.normalize('NFKC',str(s)).strip().casefold()
          lemmas=collections.defaultdict(lambda: {'ids':set(),'books':set(),'per_book':collections.defaultdict(set)})
          book_names={}
          for row in rows:
              lemma=norm(row['headword'])
              x=lemmas[lemma]
              x['ids'].add(row['word_id'])
              x['books'].add(row['book_id'])
              x['per_book'][row['book_id']].add(row['word_id'])
              book_names[row['book_id']]=row['book_title']
          cross={k:v for k,v in lemmas.items() if len(v['books'])>=2}
          inconsistent={k:v for k,v in cross.items() if len(v['ids'])>=2}
          consistent={k:v for k,v in cross.items() if len(v['ids'])==1}
          n_cross_entries=sum(len(v['per_book']) for v in cross.values())
          n_collision_entries=sum(len(v['per_book']) for v in inconsistent.values())
          pair_total=pair_shared=pair_different=0
          for v in cross.values():
              for a,b in itertools.combinations(v['books'],2):
                  pair_total+=1
                  if v['per_book'][a]&v['per_book'][b]:
                      pair_shared+=1
                  else:
                      pair_different+=1
          examples=sorted(inconsistent.items(),key=lambda x:(-len(x[1]['books']),x[0]))[:35]
          sample=[{'term':term,'books':len(v['books']),'word_ids':len(v['ids']),
                    'id_examples':sorted(v['ids'])[:5]} for term,v in examples]
          per_book=[]
          for bid,title in book_names.items():
              bwords={lemma:v for lemma,v in lemmas.items() if bid in v['books']}
              collision=sum(1 for lemma,v in bwords.items() if lemma in inconsistent)
              per_book.append({'title':title,'unique_lemmas':len(bwords),'different_id_overlap_terms':collision})
          output={
              'source':'production D1 published CET4 books only',
              'book_count':len(book_names),'distinct_lemmas':len(lemmas),
              'distinct_word_ids':len(set(row['word_id'] for row in rows)),
              'wordid_book_unique_pairs':len(rows),
              'lemmas_in_2plus_books':len(cross),
              'crossbook_lemmas_reusing_same_word_id':len(consistent),
              'crossbook_lemmas_with_multiple_word_ids':len(inconsistent),
              'crossbook_lemma_book_entries':n_cross_entries,
              'crossbook_collision_book_entries':n_collision_entries,
              'crossbook_pairwise_lemma_overlap':pair_total,
              'same_id_pairs':pair_shared,
              'different_id_pairs':pair_different,
              'per_book':sorted(per_book,key=lambda v:v['different_id_overlap_terms'],reverse=True),
              'examples_multiple_ids':sample
          }
                    defs=collections.defaultdict(lambda: collections.defaultdict(set))
          for r in rows:
              defs[norm(r['headword'])][(norm(r.get('pos') or ''),norm(r.get('meaning') or ''))].add(r['word_id'])
          variants=sorted([(k,len(v),len(lemmas[k]['books']),
             [{'pos':p,'meaning':m,'cards':len(ids)} for (p,m),ids in v.items()])
             for k,v in defs.items() if len(lemmas[k]['books'])>=2],key=lambda x:(-x[1],-x[2],x[0]))
          profile={'crossbook_headwords':len(variants),
            'one_exact_pos_meaning':sum(1 for x in variants if x[1]==1),
            'multi_exact_pos_meaning':sum(1 for x in variants if x[1]>1),
            'cases_top50':[
               {'word':x[0],'variants':x[1],'books':x[2],
                'definitions':x[3][:7]} for x in variants[:50]
            ]}
          print('CET4_MEANING_PROFILE_JSON='+json.dumps(profile,ensure_ascii=False))
          print('CET4_IDENTITY_AUDIT_JSON='+json.dumps(output,ensure_ascii=False,sort_keys=True))
          PY
