name: Verify visible claim credentials V36
on:
  push:
    branches: [feature/visible-claim-credentials-v36-merged-20261105]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: DOM behavior checks, static bundle and production config
        run: |
          set -euo pipefail
          node --check public/claim.js
          node --test tests/s160-claim-receipt-ux.test.mjs tests/s161-claim-visible-runtime.test.mjs
          npm run check
          npm run assets:production:build
      - name: All production regressions
        run: npm test
