name: Publish Miaowu V35 unified word-card learning
on:
  push:
    branches: [fix/cet4-one-word-one-card-v35-20261106]
    paths: [.github/workflows/deploy-one-card-v35.yml]
permissions:
  contents: read
concurrency:
  group: miaowu-production-worker-deploy
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.repository == 'kim-1868/miaowu-english' && github.ref == 'refs/heads/fix/cet4-one-word-one-card-v35-20261106' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert existing production D1 and strictly scoped changes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "miaowu-english-production"' deploy/production.wrangler.jsonc
          grep -Fq '"database_name": "miaowu-english-prod"' deploy/production.wrangler.jsonc
          grep -Fq '649c71b3-340c-49bf-b806-3d39256851d3' deploy/production.wrangler.jsonc
          git diff --name-only "$(git merge-base HEAD origin/release/claim-receipt-ux-v34-20261105)" HEAD > /tmp/v35-changed
          while IFS= read -r f; do
            case "$f" in
              src/study-identity.js|src/reading-library.js|src/echo-cloud.js|src/worker.js|public/app.js|public/chapter-words.js|tests/v35-cross-novel-one-card.test.mjs|docs/CET4_STORY_PRODUCTION_STANDARD.md|docs/V1_CET4_MULTI_NOVEL_CURRICULUM.md|.github/workflows/test-one-card-v35.yml|.github/workflows/deploy-one-card-v35.yml) ;;
              *) echo "UNREVIEWED_CHANGE: $f"; exit 1 ;;
            esac
          done < /tmp/v35-changed
          test ! -e private-input
          test ! -e private-output
          echo "Deploy commit: $(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full regression and production assets
        run: |
          set -euo pipefail
          npm run check
          npm test
          npm run assets:production:build
          node scripts/check-production-config.mjs deploy/production.wrangler.jsonc
          grep -Fq '学习本章新词' dist-production/public/chapter-words.js
          grep -Fq 'glossaryCache.clear()' dist-production/public/app.js
      - name: Install Cloudflare Wrangler
        run: npm install --no-save --ignore-scripts wrangler@^4
      - name: Dry-run exact Worker and assets
        run: npx wrangler deploy --dry-run --config deploy/production.wrangler.jsonc
      - name: Confirm live site exists before deployment
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 25 https://miaowu-english-pages.pages.dev/ -o /tmp/site-before
          grep -Fq 'v31-word-only' /tmp/site-before
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://miaowu-english-pages.pages.dev/api/me/words)" = 401
      - name: Check deploy credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          test "$HAS_TOKEN" = true
          test "$HAS_ACCOUNT" = true
      - name: Publish same D1 binding and preserve existing Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars --config deploy/production.wrangler.jsonc
      - name: Verify live V35 assets, login guard, and CET4 book catalog
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            curl -fsSL --max-time 25 "https://miaowu-english-pages.pages.dev/chapter-words.js?v35=$i" -o /tmp/chapter-v35 || true
            if grep -Fq '学习本章新词' /tmp/chapter-v35; then break; fi
            sleep 3
          done
          grep -Fq '学习本章新词' /tmp/chapter-v35
          curl -fsSL --retry 3 --max-time 25 'https://miaowu-english-pages.pages.dev/app.js?v35=1' -o /tmp/app-v35
          grep -Fq 'Reading decisions change sense state' /tmp/app-v35
          curl -fsSL --retry 3 --max-time 25 'https://miaowu-english-pages.pages.dev/api/books?category=cet4' -o /tmp/books-v35
          node --input-type=module -e 'import fs from "node:fs";const b=JSON.parse(fs.readFileSync("/tmp/books-v35","utf8"));if(!Array.isArray(b.books)||b.books.length<17)process.exit(1)'
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://miaowu-english-pages.pages.dev/api/me/words)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://miaowu-english-pages.pages.dev/api/me/flashcards)" = 401
          echo "V35 live assets verified and protected endpoints remain authorized-only."
