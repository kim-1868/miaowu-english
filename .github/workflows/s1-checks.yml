name: S1 checks
on:
  pull_request:
  push:
    branches:
      - dev/s1-auth-and-entitlements
      - dev/foundation-s0
      - editorial/rainy-night-versioned-draft-revision-20261103
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run transactional integration tests
        run: npm test
