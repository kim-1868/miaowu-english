name: V1.2 staging 020 post-019 readiness READ ONLY (approval required)
on:
  push:
    branches: [feature/v11-smart-vocab-preflight-20261109]
    paths:
      - .github/workflows/v12-sense-020-post019-readonly.yml
      - scripts/verify-staging-020-post019-baseline.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v12-sense-020-post019-readonly
  cancel-in-progress: false
jobs:
  post019-readonly-preflight:
    if: >-
      github.repository == 'kim-1868/miaowu-english' &&
      github.ref == 'refs/heads/feature/v11-smart-vocab-preflight-20261109'
    environment:
      name: staging-d1-schema-approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hard lock ONLY the existing TEST D1
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          assert.equal(x.name,'miaowu-english-staging');
          assert.equal(x.vars.APP_ENV,'staging');
          assert.equal(x.d1_databases.length,1);
          assert.equal(x.d1_databases[0].database_name,'miaowu-english-test');
          assert.equal(x.d1_databases[0].database_id,'88a817cb-23bb-4ae4-bcb8-92286c4165d4');
          assert.notEqual(x.vars.GLOBAL_DICTIONARY_HEADWORD_SRS_ENABLED,'true');
          assert.notEqual(x.vars.GLOBAL_DICTIONARY_HEADWORD_SRS_WRITE_ENABLED,'true');
          console.log('STAGING_020_TEST_DB_EXACT_ONLY__SRS_NOT_ENABLED');
          NODE
      - name: Install pinned major Wrangler for read-only SELECT
        run: npm install --ignore-scripts --no-save wrangler@^4
      - name: Verify post-019 and pre-020 on remote TEST D1 (NO database writes)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_D1_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?MISSING_STAGING_READ_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?MISSING_ACCOUNT_ID}"
          umask 077
          private="$RUNNER_TEMP/staging-020-private-verify"
          mkdir -m 700 "$private"
          trap 'rm -rf "$private"' EXIT
          query(){
            if ! npx wrangler d1 execute miaowu-english-test --remote --config wrangler.jsonc --json --command "$1" >"$2" 2>"$private/stderr"; then
              echo 'SENSE_020_STAGING_QUERY_FAILED_PRIVATE_OUTPUT_PURGED'
              exit 1
            fi
          }
          sql="SELECT
            (SELECT count(*) FROM sqlite_master WHERE type='table' AND name LIKE 'global_dictionary_%') dictionary_tables,
            (SELECT count(*) FROM sqlite_master WHERE type='trigger' AND name IN ('global_dictionary_bindings_draft_guard','global_dictionary_sense_identity_guard','global_dictionary_legacy_sense_link_guard','global_dictionary_legacy_sense_link_no_repoint','global_dictionary_book_sense_guard')) dictionary_guard_triggers,
            (SELECT count(*) FROM sqlite_master WHERE type='table' AND name IN ('books','words','user_words','chapter_words')) core_tables,
            (SELECT count(*) FROM sqlite_master WHERE type='table' AND name IN ('user_headword_study','user_headword_review_events')) headword_019_tables,
            (SELECT count(*) FROM sqlite_master WHERE type='index' AND name IN ('ix_user_headword_study_due','ix_user_headword_events_user_entry')) headword_019_indexes,
            (SELECT count(*) FROM sqlite_master WHERE type='table' AND name IN ('user_dictionary_sense_study','user_dictionary_sense_review_events')) sense_020_tables,
            (SELECT count(*) FROM sqlite_master WHERE type='index' AND name IN ('ix_user_dictionary_sense_due','ix_user_dictionary_sense_events')) sense_020_indexes,
            (SELECT count(*) FROM sqlite_master WHERE type='trigger' AND name IN ('user_dictionary_sense_study_approved_insert','user_dictionary_sense_study_approved_update','user_dictionary_sense_events_approved_insert')) sense_020_triggers,
            (SELECT count(*) FROM user_headword_study) headword_study_rows,
            (SELECT count(*) FROM user_headword_review_events) headword_events_rows,
            (SELECT count(*) FROM global_dictionary_entries) candidate_heads,
            (SELECT count(*) FROM global_dictionary_forms) candidate_forms,
            (SELECT count(*) FROM global_dictionary_entries WHERE source_name='upstream_ecdict_unverified') upstream_heads,
            (SELECT count(*) FROM global_dictionary_entries WHERE source_name!='upstream_ecdict_unverified') other_heads,
            (SELECT count(*) FROM global_dictionary_forms WHERE source_name='upstream_ecdict_unverified') upstream_forms,
            (SELECT count(*) FROM global_dictionary_forms WHERE source_name!='upstream_ecdict_unverified') other_forms,
            (SELECT count(*) FROM global_dictionary_sources WHERE source_key='upstream_ecdict_unverified' AND license_reviewed=0 AND enabled=0 AND imported_entries=11422 AND imported_forms=16442) source_registry_intact,
            (SELECT count(*) FROM global_dictionary_senses WHERE approved=1) approved_senses,
            (SELECT count(*) FROM global_dictionary_entries WHERE teaching_ready=1) teaching_ready,
            (SELECT count(*) FROM global_dictionary_sources WHERE enabled=1) active_sources,
            (SELECT count(*) FROM global_dictionary_lessons) approved_lessons,
            (SELECT count(*) FROM books) old_books,
            (SELECT count(*) FROM chapters) old_chapters,
            (SELECT count(*) FROM words) old_words,
            (SELECT count(*) FROM user_words) old_user_words,
            (SELECT count(*) FROM review_events) old_review_events,
            (SELECT count(*) FROM entitlements) old_entitlements,
            (SELECT count(*) FROM activation_codes) old_activation_codes,
            (SELECT count(*) FROM chapter_words) old_chapter_words,
            (SELECT count(*) FROM reading_progress) old_reading_progress;"
          query "$sql" "$private/counts.json"
          query 'PRAGMA foreign_key_check;' "$private/fk.json"
          query 'PRAGMA quick_check;' "$private/quick.json"
          node scripts/verify-staging-020-post019-baseline.mjs "$private/counts.json" "$private/fk.json" "$private/quick.json"
      - name: Read-only phase certified, never a deploy or migration
        run: |
          echo 'POST_019_PRE_020_READONLY_GUARD_COMPLETE'
          echo 'NO_CLOUDFLARE_WRITE_NO_LIVE_USER_MIGRATION_NO_PRODUCTION_DEPLOY'
