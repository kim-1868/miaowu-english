<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-labelledby="title desc">
<title id="title">雨夜档案 · 小说封面</title>
<desc id="desc">深蓝雨夜中，旧街道的暖光灯下，一位打伞的人走向亮着灯的档案室。</desc>
